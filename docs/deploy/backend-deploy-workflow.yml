# 원본은 lc-infra 의 docs/deploy/backend-deploy-workflow.yml 이다. 고칠 때는 둘을 함께 고친다.
#
# 배포 절차가 인프라 결정에서 나오기 때문에 원본을 인프라가 갖는다.
# ASG 이름, 대상 그룹 이름, SSM 경로가 전부 Terraform 이 정한 값이다.
#
# 필요한 설정
#   변수   AWS_DEPLOY_ROLE_ARN   lc-infra bootstrap 의 terraform output github_role_arns 의 deploy 값
#   시크릿 SLACK_WEBHOOK_DEPLOY  배포 알림 채널 웹훅. 없으면 알림만 건너뛴다

name: 배포

# main 병합 시에만 배포한다.
#
# 팀원은 develop 으로만 PR 을 열고 main 으로 가는 경로는 관리자의 릴리스 PR 뿐이다.
# main 은 보호 브랜치라 PR 병합 외에 push 경로가 없으므로 이 트리거로 충분하다.
#
# AWS 쪽에서도 같은 조건이 강제된다.
# 배포 역할의 신뢰 정책이 repo:...:ref:refs/heads/main 으로 못 박혀 있어
# 다른 브랜치에서 이 워크플로를 돌려도 STS 가 자격증명을 주지 않는다.
on:
  push:
    branches: [main]
  # 인프라를 다시 세운 뒤 lc-infra 의 apply.sh 가 main 배포를 다시 건다. 다른 브랜치로 돌리면 STS 가 거부한다.
  workflow_dispatch:

# 배포는 중간에 끊으면 안 된다. 구 인스턴스를 지우는 도중에 취소되면 용량이 반이 된다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# packages 는 GHCR 시절의 것이다. ECR 로 옮기면서 뺐다.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 배포 스크립트는 lc-infra 가 소유한다. llm-verify 가 형제 저장소를 받아 쓰는 것과 같은 방식이다.
      - name: 인프라 스크립트
        uses: actions/checkout@v4
        with:
          repository: lunch-catch/lc-infra
          path: infra

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 외부 액션은 태그가 아니라 커밋으로 고정한다. 태그는 옮겨질 수 있어 배포 권한을 가진 잡에서 남의 코드가 바뀐 채 돈다
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: 빌드
        run: ./gradlew bootJar --no-daemon

      # ECR 로그인에 필요해서 push 앞에 있다. GHCR 일 때는 배포 단계 앞에만 있으면 됐다.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # 태그는 커밋 SHA 다. latest 를 쓰지 않는다.
      # 어느 인스턴스가 어느 버전인지 태그만 보고 알 수 있어야 롤백 판단이 선다.
      #
      # 저장소가 IMMUTABLE 이라 같은 SHA 로 다시 밀면 push 가 거부된다.
      # 재실행으로 이미지가 바뀌는 일이 없어야 태그가 버전의 근거가 된다.
      - name: 이미지 push
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/lunchcatch:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # 0번 사전 점검부터 10번 최종 확인까지 스크립트가 수행한다.
      - name: 롤링 배포
        env:
          PROJECT: lunchcatch
          # 스모크 대상의 호스트는 deploy.sh 가 ALB 에서 직접 조회한다.
          # 여기서 정하는 것은 경로뿐이다. 인증 없이 열린 GET 이 API 문서뿐이라 그것을 찌른다.
          SMOKE_PATH: ${{ vars.SMOKE_PATH || '/v3/api-docs' }}
        run: infra/scripts/deploy.sh ${{ github.sha }}

      # 배포 알림만 Alertmanager 를 거치지 않는다.
      # AWS 자격증명을 얻기 전에도 실패를 알려야 해서 웹훅을 저장소 시크릿에 둔다.
      - name: 결과 알림
        if: always()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          STATUS="${{ job.status }}"
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"[$STATUS] 배포 ${{ github.sha }} by ${{ github.actor }}\"}"

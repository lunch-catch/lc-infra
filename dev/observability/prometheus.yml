# 개발 서버의 Prometheus 다 (개발 서버 문서 11장). 같은 compose 의 앱만 긁는다.
# 레이블은 운영(observability/prometheus/prometheus.yml)과 같게 붙인다. 운영 대시보드를 그대로 쓰려는 것이다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 대시보드의 기준선, 배치의 기준, SLI 를 운영과 같게 그리려고 값을 만드는 규칙만 읽는다(lc-infra #171).
# 경보 규칙(rules.yml)은 읽지 않는다. 개발은 Alertmanager 가 없고, API 와 배치를 한 프로세스(job="app")로 돌려 BatchAllDown 같은 경보가 늘 잘못 울린다
rule_files:
  - /etc/prometheus/thresholds.yml
  - /etc/prometheus/sli.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 개발은 API 와 배치가 한 프로세스다. 앱은 app-blue 와 app-green 중 하나가 돌아 둘 다 적고, 쉬는 쪽은 up 0 으로 남는다
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-blue:8081", "app-green:8081"]
        labels:
          instance: lunchcatch-dev
          instance_id: dev

  # 추적 저장소다(lc-infra #185). 개발은 늘 뜬다. 경보는 없지만 모니터링 상태 대시보드가 이 값으로 그린다
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

# 추적 저장소(Tempo)다. tracing 프로필이 켜진 부하 시험 환경에서만 뜬다(lunch-catch/lc-infra#72).
# 스팬은 서버마다 도는 Alloy 가 테일 샘플링 뒤에 보낸다(observability/alloy/tracing.alloy).
stream_over_http_enabled: true
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    # 부하 시험 환경은 시험이 끝나면 지운다. 사흘이면 회차를 되짚기에 넉넉하다
    block_retention: 72h
# 스팬 이름별 호출 수와 지연(span-metrics), 서비스 사이 관계(service-graphs)를 지표로 만들어 Prometheus 로 보낸다
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

# 데이터소스를 손으로 등록하지 않는다. 인스턴스를 다시 만들어도 그대로여야 한다 (OPS-2-18).
#
# uid 를 직접 준다.
# 비워 두면 Grafana 가 임의로 만들어 인스턴스마다 값이 달라지고,
# 대시보드 JSON 이 그 uid 를 참조하므로 재생성 후 패널이 전부 빈 화면이 된다.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # prometheus.yml 의 scrape_interval 과 같게 둔다. 패널의 $__rate_interval 이 이 값의 4배(1분)부터 시작한다 (#60)
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

# 데이터소스를 손으로 등록하지 않는다. 인스턴스를 다시 만들어도 그대로여야 한다 (OPS-2-18).
#
# uid 를 직접 준다.
# 비워 두면 Grafana 가 임의로 만들어 인스턴스마다 값이 달라지고,
# 대시보드 JSON 이 그 uid 를 참조하므로 재생성 후 패널이 전부 빈 화면이 된다.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # prometheus.yml 의 scrape_interval 과 같게 둔다. 패널의 $__rate_interval 이 이 값의 4배(1분)부터 시작한다 (#60)
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # 로그의 trace_id(OpenTelemetry 에이전트가 남김)에서 그 요청의 추적(Tempo)으로 넘어간다.
      # 로그의 traceId 는 앱이 만든 별개의 값이라 쓰지 않는다. Tempo 가 없는 운영에서는 링크만 깨진다
      derivedFields:
        - name: trace_id
          datasourceUid: tempo
          matcherRegex: '"trace_id":"(\w+)"'
          url: "$${__value.raw}"

  # Pyroscope 는 부하 시험 환경에서만 뜬다. 운영에서는 이 데이터 소스를 고르면 연결 오류가 난다
  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040

  # Tempo 도 부하 시험 환경에서만 뜬다. 추적에서 로그(Loki), 지표(Prometheus), 프로파일(Pyroscope)로 넘어간다
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        customQuery: true
        query: '{container=~"lunchcatch.*"} |= "$${__trace.traceId}"'
      tracesToProfiles:
        datasourceUid: pyroscope
        profileTypeId: wall:wall:nanoseconds:cpu:nanoseconds
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true

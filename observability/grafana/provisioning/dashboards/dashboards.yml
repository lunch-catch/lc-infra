# 대시보드도 데이터소스와 같은 이유로 Git 이 갖는다 (INF-32, OPS-2-18).
#
# 화면에서 만든 대시보드는 grafana-data 볼륨에만 남아 인스턴스를 다시 만들면 사라진다.
# allowUiUpdates 를 false 로 두어 화면에서 고친 것이 저장되지 않게 한다.
# 고칠 일이 생기면 JSON 을 커밋하고 컨테이너를 재시작한다.
#
# 대시보드는 계층마다 Grafana 폴더 하나에 묶는다(lc-infra #169). 디렉터리는 영어로 두어 스크립트에서 다루기 쉽게 하고,
# 화면에 보이는 폴더 이름은 provider 마다 folder 로 붙인다. 폴더와 폴더 안의 대시보드는 계층 순서로 둔다. Grafana 는 이름순으로만 놓아, 폴더 이름과 대시보드 제목 앞에 "1." 꼴의 순번을 붙인다(대시보드가 하나뿐인 폴더는 붙이지 않는다). 파일 이름과 uid 에는 붙이지 않는다. 폴더 이름을 바꿔도 같은 폴더로 이어지게 folderUid 를 둔다. Grafana 는 폴더를 처음 만들 때만 folder 이름을 쓰고 이미 있는 폴더의 이름은 고치지 않으므로, 이름을 바꾸면 띄워 둔 Grafana 에서 폴더 API(PUT /api/folders/{uid})로 이름을 바꾼다. Grafana 를 열면 먼저 뜨게 홈 대시보드로도 둔다(compose 의 GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH).
apiVersion: 1

providers:
  - name: lunchcatch-overview
    type: file
    folder: "1. 개요"
    folderUid: lc-folder-overview
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/overview
  - name: lunchcatch-service
    type: file
    folder: "2. 서비스"
    folderUid: lc-folder-service
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/service
  - name: lunchcatch-dependency
    type: file
    folder: "5. 의존 시스템"
    folderUid: lc-folder-dependency
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/dependency
  - name: lunchcatch-runtime
    type: file
    folder: "4. 런타임"
    folderUid: lc-folder-runtime
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/runtime
  - name: lunchcatch-infra
    type: file
    folder: "6. 인프라"
    folderUid: lc-folder-infra
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/infra
  - name: lunchcatch-domain
    type: file
    folder: "3. 도메인"
    folderUid: lc-folder-domain
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/domain
  - name: lunchcatch-test
    type: file
    folder: "7. 테스트"
    folderUid: lc-folder-test
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/test

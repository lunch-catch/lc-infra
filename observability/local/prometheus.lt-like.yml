# compose.lt-like.yaml 이 쓰는 Prometheus 설정이다. prometheus.yml 과 배치를 긁는 곳만 다르다. 한쪽을 고치면 다른 쪽도 같은 PR 에서 고친다
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/thresholds.yml
  - /etc/prometheus/sli.yml

scrape_configs:
  - job_name: app
    metrics_path: /actuator/prometheus
    # 부하로 CPU 가 바닥나면 지표 응답이 10초(기본값)를 넘는다. 수집 간격과 같게 두어 늦은 칸을 건진다. 늘려도 수집은 겹치지 않는다(#159)
    scrape_timeout: 15s
    static_configs:
      - targets: ["app:8081"]
        labels:
          instance: local-app

  # 이 구성은 배치를 따로 띄운다. 부하 시험 환경처럼 배치 컨테이너를 그대로 긁는다
  - job_name: batch
    metrics_path: /actuator/prometheus
    # 앱과 같은 까닭이다(#159)
    scrape_timeout: 15s
    static_configs:
      - targets: ["batch:8081"]
        labels:
          instance: local-batch

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {instance: local-host, role: app}

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: {instance: local-host}

  - job_name: mysqld
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

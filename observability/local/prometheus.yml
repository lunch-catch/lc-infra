global:
  scrape_interval: 15s

scrape_configs:
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8081"]
        labels:
          instance: local-app

  # 로컬은 앱 하나가 배치 역할도 한다. 대시보드가 job="batch" 로 보는 릴레이 지표만 다시 긁는다.
  - job_name: batch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8081"]
        labels:
          instance: local-batch
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: adserving_impression_dispatch.*
        action: keep

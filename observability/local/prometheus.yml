global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/thresholds.yml
  - /etc/prometheus/sli.yml

scrape_configs:
  # 운영처럼 자기 자신도 수집해, 모니터링 상태의 규칙 평가 실패 패널과 경보를 로컬에서도 확인한다(lc-infra #171)
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: app
    metrics_path: /actuator/prometheus
    # 부하로 CPU 가 바닥나면 지표 응답이 10초(기본값)를 넘는다. 수집 간격과 같게 두어 늦은 칸을 건진다. 늘려도 수집은 겹치지 않는다(#159)
    scrape_timeout: 15s
    static_configs:
      - targets: ["app:8081"]
        labels:
          instance: local-app

  # 로컬은 앱 하나가 배치 역할도 한다. 대시보드가 job="batch" 로 보는 릴레이 지표와 작업 지표만 다시 긁는다.
  - job_name: batch
    metrics_path: /actuator/prometheus
    # 앱과 같은 까닭이다(#159)
    scrape_timeout: 15s
    static_configs:
      - targets: ["app:8081"]
        labels:
          instance: local-batch
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: adserving_impression_dispatch.*|batch_job_.*
        action: keep

  # 테일 샘플링의 판정 전에 버린 트레이스와 거절한 스팬, Tempo 의 거절을 로컬에서도 본다(lc-infra #207). 운영은 앱 서버의 Alloy 와 모니터링 서버의 Tempo 를 긁는다
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
        labels: {instance: local-app}

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {instance: local-host, role: app}

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: {instance: local-host}

  - job_name: mysqld
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

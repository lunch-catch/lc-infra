# 기준 시계열이 정한 값과 이름으로 나오는지 확인한다(lc-infra #107, #111).
#   docker run --rm -v "$PWD/observability/prometheus:/p" --entrypoint promtool prom/prometheus:v3.13.1 test rules /p/thresholds_test.yml
rule_files:
  - thresholds.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    promql_expr_test:
      - expr: overrun_threshold_seconds
        eval_time: 1m
        exp_samples:
          - labels: 'overrun_threshold_seconds{kind="global", name="gc-pause"}'
            value: 0.2
          - labels: 'overrun_threshold_seconds{kind="global", name="connection-acquire"}'
            value: 3

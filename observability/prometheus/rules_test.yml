# BatchNotRun 의 주기별 임계값(lc-infra #44)과 정산, 분석 경보의 1차(lc-infra #43)를 확인한다.
#   docker run --rm -v "$PWD/observability/prometheus:/p" --entrypoint promtool prom/prometheus:v3.13.1 test rules /p/rules_test.yml
#
# 값은 마지막 성공 시각(초)이다. 0 은 시험 시작 때 성공하고 그 뒤로 성공하지 않은 작업,
# 0+60x... 은 매분 성공해 늘 최신인 작업이다.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'batch_job_last_success_timestamp_seconds{instance="b1", scheduler="DailyJobScheduler.sendHeartbeat()"}'
        values: '0x3100'
      - series: 'batch_job_last_success_timestamp_seconds{instance="b2", scheduler="DailyJobScheduler.sendHeartbeat()"}'
        values: '0+60x3100'
      - series: 'batch_job_last_success_timestamp_seconds{instance="b1", scheduler="PaymentRecheckWorker.recheckUnknownPayments()"}'
        values: '0x3100'
      - series: 'batch_job_last_success_timestamp_seconds{instance="b1", scheduler="RechargeReservationWorker.reserveCharged()"}'
        values: '0x3100'
      - series: 'batch_job_last_success_timestamp_seconds{instance="b1", scheduler="ImpressionDispatchJob.dispatchPending()"}'
        values: '0x3100'
      - series: 'batch_job_last_success_timestamp_seconds{instance="b1", scheduler="DailyAggregationJob.run()"}'
        values: '0x3100'
      - series: 'batch_job_last_success_timestamp_seconds{instance="b1", scheduler="CouponIssueCloseJob.closeCoupons()"}'
        values: '0x3100'
      - series: 'batch_job_last_success_timestamp_seconds{instance="b1", scheduler="EventLogRetentionJob.purgeExpiredEvents()"}'
        values: '0x3100'
    alert_rule_test:
      # 4분: 아무것도 울리지 않는다. 결제 재조회, 충전 재예약, 노출 릴레이도 5분 전이다
      - eval_time: 4m
        alertname: BatchNotRun
        exp_alerts: []
      # 40분: 생존 신호, 결제 재조회, 충전 재예약, 노출 릴레이만 울린다. 하루 작업은 성공한 지 40분이라 울리지 않는다 (예전에는 울렸다)
      - eval_time: 40m
        alertname: BatchNotRun
        exp_alerts:
          - exp_labels: {severity: warning, instance: b1, scheduler: "DailyJobScheduler.sendHeartbeat()"}
            exp_annotations: {description: "배치 b1 의 DailyJobScheduler.sendHeartbeat() 가 주기를 넘겨 성공하지 못했다"}
          - exp_labels: {severity: warning, instance: b1, scheduler: "PaymentRecheckWorker.recheckUnknownPayments()"}
            exp_annotations: {description: "배치 b1 의 PaymentRecheckWorker.recheckUnknownPayments() 가 주기를 넘겨 성공하지 못했다"}
          - exp_labels: {severity: warning, instance: b1, scheduler: "RechargeReservationWorker.reserveCharged()"}
            exp_annotations: {description: "배치 b1 의 RechargeReservationWorker.reserveCharged() 가 주기를 넘겨 성공하지 못했다"}
          - exp_labels: {severity: warning, instance: b1, scheduler: "ImpressionDispatchJob.dispatchPending()"}
            exp_annotations: {description: "배치 b1 의 ImpressionDispatchJob.dispatchPending() 가 주기를 넘겨 성공하지 못했다"}
      # 26시간: 하루 작업이 울린다. 이벤트 보존은 50시간 전이라 울리지 않는다
      - eval_time: 1560m
        alertname: BatchNotRun
        exp_alerts:
          - exp_labels: {severity: warning, instance: b1, scheduler: "DailyJobScheduler.sendHeartbeat()"}
            exp_annotations: {description: "배치 b1 의 DailyJobScheduler.sendHeartbeat() 가 주기를 넘겨 성공하지 못했다"}
          - exp_labels: {severity: warning, instance: b1, scheduler: "PaymentRecheckWorker.recheckUnknownPayments()"}
            exp_annotations: {description: "배치 b1 의 PaymentRecheckWorker.recheckUnknownPayments() 가 주기를 넘겨 성공하지 못했다"}
          - exp_labels: {severity: warning, instance: b1, scheduler: "RechargeReservationWorker.reserveCharged()"}
            exp_annotations: {description: "배치 b1 의 RechargeReservationWorker.reserveCharged() 가 주기를 넘겨 성공하지 못했다"}
          - exp_labels: {severity: warning, instance: b1, scheduler: "ImpressionDispatchJob.dispatchPending()"}
            exp_annotations: {description: "배치 b1 의 ImpressionDispatchJob.dispatchPending() 가 주기를 넘겨 성공하지 못했다"}
          - exp_labels: {severity: warning, instance: b1, scheduler: "DailyAggregationJob.run()"}
            exp_annotations: {description: "배치 b1 의 DailyAggregationJob.run() 가 주기를 넘겨 성공하지 못했다"}
          - exp_labels: {severity: warning, instance: b1, scheduler: "CouponIssueCloseJob.closeCoupons()"}
            exp_annotations: {description: "배치 b1 의 CouponIssueCloseJob.closeCoupons() 가 주기를 넘겨 성공하지 못했다"}
      # 51시간: 이벤트 보존까지 울린다. 매분 성공하는 b2 는 끝까지 울리지 않는다
      - eval_time: 3060m
        alertname: BatchNotRun
        exp_alerts:
          - exp_labels: {severity: warning, instance: b1, scheduler: "DailyJobScheduler.sendHeartbeat()"}
            exp_annotations: {description: "배치 b1 의 DailyJobScheduler.sendHeartbeat() 가 주기를 넘겨 성공하지 못했다"}
          - exp_labels: {severity: warning, instance: b1, scheduler: "PaymentRecheckWorker.recheckUnknownPayments()"}
            exp_annotations: {description: "배치 b1 의 PaymentRecheckWorker.recheckUnknownPayments() 가 주기를 넘겨 성공하지 못했다"}
          - exp_labels: {severity: warning, instance: b1, scheduler: "RechargeReservationWorker.reserveCharged()"}
            exp_annotations: {description: "배치 b1 의 RechargeReservationWorker.reserveCharged() 가 주기를 넘겨 성공하지 못했다"}
          - exp_labels: {severity: warning, instance: b1, scheduler: "ImpressionDispatchJob.dispatchPending()"}
            exp_annotations: {description: "배치 b1 의 ImpressionDispatchJob.dispatchPending() 가 주기를 넘겨 성공하지 못했다"}
          - exp_labels: {severity: warning, instance: b1, scheduler: "DailyAggregationJob.run()"}
            exp_annotations: {description: "배치 b1 의 DailyAggregationJob.run() 가 주기를 넘겨 성공하지 못했다"}
          - exp_labels: {severity: warning, instance: b1, scheduler: "CouponIssueCloseJob.closeCoupons()"}
            exp_annotations: {description: "배치 b1 의 CouponIssueCloseJob.closeCoupons() 가 주기를 넘겨 성공하지 못했다"}
          - exp_labels: {severity: warning, instance: b1, scheduler: "EventLogRetentionJob.purgeExpiredEvents()"}
            exp_annotations: {description: "배치 b1 의 EventLogRetentionJob.purgeExpiredEvents() 가 주기를 넘겨 성공하지 못했다"}

  # 충전 재예약의 5분 경계와 해소. b1 은 0분에 성공하고 20분 동안 멈췄다가 21분부터 다시 매분 성공한다. b2 는 매분 성공한다.
  #   10분  6분에 5분을 넘었지만 for 5분이 안 차 울리지 않는다
  #   12분  b1 만 울린다. 30분 목록에 잘못 넣었다면 여기서 울리지 않는다
  #   25분  성공 시각이 갱신되어 해소된다
  - interval: 1m
    input_series:
      - series: 'batch_job_last_success_timestamp_seconds{instance="b1", scheduler="RechargeReservationWorker.reserveCharged()"}'
        values: '0x20 1260+60x20'
      - series: 'batch_job_last_success_timestamp_seconds{instance="b2", scheduler="RechargeReservationWorker.reserveCharged()"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: BatchNotRun
        exp_alerts: []
      - eval_time: 12m
        alertname: BatchNotRun
        exp_alerts:
          - exp_labels: {severity: warning, instance: b1, scheduler: "RechargeReservationWorker.reserveCharged()"}
            exp_annotations: {description: "배치 b1 의 RechargeReservationWorker.reserveCharged() 가 주기를 넘겨 성공하지 못했다"}
      - eval_time: 25m
        alertname: BatchNotRun
        exp_alerts: []

  # 정산과 분석의 "한 건이라도" 경보. 30분에 한 건 오르고 121분에 서버가 다시 떠 카운터가 0 으로 돌아간다.
  #   20분  평소(0): 울리지 않는다
  #   40분  한 건 오름: 울린다
  #   100분 오른 뒤 1시간이 지남: 해소된다
  #   125분 카운터 초기화(1 -> 0): 줄어든 것을 증가로 보지 않아 울리지 않는다
  # 같은 카운터의 다른 결과(성공, error 등)는 늘어도 울리지 않는다.
  - interval: 1m
    input_series:
      - series: 'billing_payment_recheck_exhausted_total{job="batch", instance="b1"}'
        values: '0x30 1x90 0x60'
      - series: 'billing_pg_recon_total{job="batch", instance="b1", result="mismatch"}'
        values: '0x30 1x90 0x60'
      - series: 'billing_pg_recon_total{job="batch", instance="b1", result="recovered"}'
        values: '0x180'
      - series: 'billing_pg_recon_total{job="batch", instance="b1", result="error"}'
        values: '0+1x180'
      - series: 'analytics_aggregation_total{job="batch", instance="b1", result="failed"}'
        values: '0x30 1x90 0x60'
      - series: 'analytics_aggregation_total{job="batch", instance="b1", result="success"}'
        values: '0+1x180'
    alert_rule_test:
      - eval_time: 20m
        alertname: BillingRecheckExhausted
        exp_alerts: []
      - eval_time: 40m
        alertname: BillingRecheckExhausted
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {description: "결제 재조회를 다 쓰고도 승인 결과를 모르는 결제가 생겼다. PG 관리자 화면에서 상태를 확인하고 손으로 확정하라"}
      - eval_time: 100m
        alertname: BillingRecheckExhausted
        exp_alerts: []
      - eval_time: 125m
        alertname: BillingRecheckExhausted
        exp_alerts: []
      - eval_time: 20m
        alertname: BillingPgReconMismatch
        exp_alerts: []
      - eval_time: 40m
        alertname: BillingPgReconMismatch
        exp_alerts:
          - exp_labels: {severity: warning, result: mismatch}
            exp_annotations: {description: "PG 대사에서 mismatch 가 나왔다. mismatch 는 손으로 맞추고, recovered 는 어긋난 원인을 확인하라"}
      - eval_time: 100m
        alertname: BillingPgReconMismatch
        exp_alerts: []
      - eval_time: 125m
        alertname: BillingPgReconMismatch
        exp_alerts: []
      - eval_time: 20m
        alertname: AnalyticsAggregationFailed
        exp_alerts: []
      - eval_time: 40m
        alertname: AnalyticsAggregationFailed
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {description: "일 집계가 실패했다. 배치 로그의 ANALYTICS_DAILY_AGGREGATION 이벤트로 원인을 확인하라"}
      - eval_time: 100m
        alertname: AnalyticsAggregationFailed
        exp_alerts: []
      - eval_time: 125m
        alertname: AnalyticsAggregationFailed
        exp_alerts: []

  # 시리즈가 없을 때. 카운터가 아직 등록되지 않은 서버나 개발 환경에서 울리지 않는다.
  - interval: 1m
    input_series:
      - series: 'up{job="batch", instance="b1"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: BillingRecheckExhausted
        exp_alerts: []
      - eval_time: 30m
        alertname: BillingPgReconMismatch
        exp_alerts: []
      - eval_time: 30m
        alertname: AnalyticsAggregationFailed
        exp_alerts: []
      - eval_time: 30m
        alertname: AnalyticsPendingDatesHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: AnalyticsConsistencyViolation
        exp_alerts: []
      - eval_time: 30m
        alertname: BatchNotRun
        exp_alerts: []

  # 밀린 날짜. 배치 b1 이 20분부터 60분까지 3 이고 그 뒤 0 이다. API 서버 a1 은 5 지만 집계를 돌지 않아 보지 않는다.
  #   15분  0: 울리지 않는다
  #   25분  3 이 된 지 5분: for 10분이 안 차 울리지 않는다
  #   35분  3 이 15분째: 울린다
  #   70분  0 으로 돌아옴: 해소된다
  - interval: 1m
    input_series:
      - series: 'analytics_aggregation_pending_dates{job="batch", instance="b1"}'
        values: '0x20 3x40 0x30'
      - series: 'analytics_aggregation_pending_dates{job="app", instance="a1"}'
        values: '5x90'
    alert_rule_test:
      - eval_time: 15m
        alertname: AnalyticsPendingDatesHigh
        exp_alerts: []
      - eval_time: 25m
        alertname: AnalyticsPendingDatesHigh
        exp_alerts: []
      - eval_time: 35m
        alertname: AnalyticsPendingDatesHigh
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {description: "집계하지 못한 날짜가 3 일 쌓였다. 일 집계가 며칠째 실패하고 있다. 통계 화면이 그만큼 비어 있다"}
      - eval_time: 70m
        alertname: AnalyticsPendingDatesHigh
        exp_alerts: []

  # 정합성 위반. 배치 두 대 중 마지막으로 집계에 성공한 서버의 값만 본다.
  #   처음 30분: b2 가 더 늦게 성공했고(200) 위반이 0 이다. b1 에는 예전 실행의 위반 4 가 남아 있지만 울리지 않는다
  #   30분 뒤: b1 이 다시 성공해(300) 마지막 서버가 되고 위반이 2 다. 울린다
  #   60분 뒤: b1 의 다음 실행이 위반 0 을 냈다. 해소된다
  - interval: 1m
    input_series:
      - series: 'batch_job_last_success_timestamp_seconds{job="batch", instance="b1", instance_id="i-1", scheduler="DailyAggregationJob.run()"}'
        values: '100x30 300x30 400x30'
      - series: 'batch_job_last_success_timestamp_seconds{job="batch", instance="b2", instance_id="i-2", scheduler="DailyAggregationJob.run()"}'
        values: '200x90'
      - series: 'analytics_consistency_violations{job="batch", instance="b1", instance_id="i-1", check="ledger_sum"}'
        values: '4x30 2x30 0x30'
      - series: 'analytics_consistency_violations{job="batch", instance="b2", instance_id="i-2", check="ledger_sum"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 20m
        alertname: AnalyticsConsistencyViolation
        exp_alerts: []
      - eval_time: 45m
        alertname: AnalyticsConsistencyViolation
        exp_alerts:
          - exp_labels: {severity: warning, check: ledger_sum}
            exp_annotations: {description: "집계 정합성 검사 ledger_sum 가 위반 2 건을 찾았다. 집계 결과를 믿기 전에 원천 데이터와 맞춰 보라"}
      - eval_time: 75m
        alertname: AnalyticsConsistencyViolation
        exp_alerts: []

  # HikariConnectionTimeout 은 커넥션을 시간 제한 안에 얻지 못한 실패가 한 건이라도 생기면 울린다(#111).
  #   처음 10분: 실패가 없다
  #   10분에 한 건 실패한다. 울린다
  #   그 뒤 5분이 지나 증가가 0 이 되면 해소된다
  - interval: 1m
    input_series:
      - series: 'hikaricp_connections_timeout_total{job="app", instance="a1", instance_id="i-1", pool="HikariPool-1"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: HikariConnectionTimeout
        exp_alerts: []
      - eval_time: 12m
        alertname: HikariConnectionTimeout
        exp_alerts:
          - exp_labels: {severity: warning, instance: a1, instance_id: i-1}
            exp_annotations: {description: "a1 에서 커넥션을 시간 제한 안에 얻지 못해 요청이 실패했다. 풀 크기와 오래 쥔 커넥션을 확인하라"}
      - eval_time: 25m
        alertname: HikariConnectionTimeout
        exp_alerts: []

  # 03 의 세 경보(#108). 평소, 기준 초과, 해소, 카운터 초기화를 본다. a2 는 시리즈가 없어 어느 경보도 울리지 않는다.
  #   GC         20분까지 평소(0.5%), 20~50분 20%, 그 뒤 평소. 80분에 서버가 다시 떠 카운터가 0 으로 돌아간다
  #   힙         처음 2분은 GC 전이라 최대 크기가 0 이다. 20~50분 90%, 그 밖은 10%
  #   트랜잭션   분당 100건. 20~50분은 3% 가 1초를 넘는다. 80분에 카운터 초기화.
  #              b1 은 분당 10건이라 절반이 1초를 넘어도 5분 100건이 안 돼 울리지 않는다
  - interval: 1m
    input_series:
      - series: 'jvm_gc_pause_seconds_sum{job="app", instance="a1"}'
        values: '0+0.3x20 6+12x30 366+0.3x29 0+0.3x20'
      - series: 'jvm_gc_live_data_size_bytes{job="app", instance="a1"}'
        values: '0 0 100x18 900x30 100x50'
      - series: 'jvm_gc_max_data_size_bytes{job="app", instance="a1"}'
        values: '0 0 1000x98'
      - series: 'hikaricp_connections_usage_seconds_count{job="app", instance="a1"}'
        values: '0+100x20 2000+100x30 5000+100x29 0+100x20'
      - series: 'hikaricp_connections_usage_seconds_bucket{job="app", instance="a1", le="1.0"}'
        values: '0+100x20 2000+97x30 4910+100x29 0+100x20'
      - series: 'hikaricp_connections_usage_seconds_count{job="batch", instance="b1"}'
        values: '0+10x100'
      - series: 'hikaricp_connections_usage_seconds_bucket{job="batch", instance="b1", le="1.0"}'
        values: '0+5x100'
    alert_rule_test:
      - eval_time: 1m
        alertname: HeapAfterGcHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: GcOverheadHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: HeapAfterGcHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: TransactionSlow
        exp_alerts: []
      # 힙은 10분을 기다려 25분에는 아직 울리지 않는다
      - eval_time: 25m
        alertname: HeapAfterGcHigh
        exp_alerts: []
      - eval_time: 35m
        alertname: GcOverheadHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: app, instance: a1}
            exp_annotations: {description: "a1 가 5분 넘게 시간의 10% 넘게 GC 로 멈췄다. GC 뒤에 남은 힙을 확인하라"}
      - eval_time: 35m
        alertname: HeapAfterGcHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: app, instance: a1}
            exp_annotations: {description: "a1 의 GC 뒤에 남은 힙이 10분 넘게 85% 를 넘었다. 메모리 누수와 힙 크기를 확인하라"}
      - eval_time: 35m
        alertname: TransactionSlow
        exp_alerts:
          - exp_labels: {severity: warning, job: app, instance: a1}
            exp_annotations: {description: "a1 에서 커넥션을 1초 넘게 쥔 사용이 1% 를 넘었다. 03 의 트랜잭션 시간과 누수 감지 경고 로그로 오래 쥔 코드를 확인하라"}
      - eval_time: 65m
        alertname: GcOverheadHigh
        exp_alerts: []
      - eval_time: 65m
        alertname: HeapAfterGcHigh
        exp_alerts: []
      - eval_time: 65m
        alertname: TransactionSlow
        exp_alerts: []
      - eval_time: 85m
        alertname: GcOverheadHigh
        exp_alerts: []
      - eval_time: 85m
        alertname: TransactionSlow
        exp_alerts: []

  # 릴레이의 결과 경보(lc-infra #150). 발행 지연은 앞 20분 동안 모두 1초 안에, 뒤 40분 동안 모두 8초 걸려 넘긴다.
  # adserving.impression 은 기본 기준(5초)이라 뒤에서 울리고, billing.recheck 는 이름별 기준(30초)이라 같은 지연에도 울리지 않는다.
  - interval: 1m
    input_series:
      - series: 'overrun_threshold_seconds{kind="relay", name="default"}'
        values: '5x60'
      - series: 'overrun_threshold_seconds{kind="relay", name="billing.recheck"}'
        values: '30x60'
      - series: 'outbox_relay_publish_delay_seconds_bucket{relay="adserving.impression", le="1.0"}'
        values: '0+100x20 2000x40'
      - series: 'outbox_relay_publish_delay_seconds_bucket{relay="adserving.impression", le="5.0"}'
        values: '0+100x20 2000x40'
      - series: 'outbox_relay_publish_delay_seconds_bucket{relay="adserving.impression", le="10.0"}'
        values: '0+100x60'
      - series: 'outbox_relay_publish_delay_seconds_bucket{relay="adserving.impression", le="+Inf"}'
        values: '0+100x60'
      - series: 'outbox_relay_publish_delay_seconds_bucket{relay="billing.recheck", le="1.0"}'
        values: '0+100x20 2000x40'
      - series: 'outbox_relay_publish_delay_seconds_bucket{relay="billing.recheck", le="5.0"}'
        values: '0+100x20 2000x40'
      - series: 'outbox_relay_publish_delay_seconds_bucket{relay="billing.recheck", le="10.0"}'
        values: '0+100x60'
      - series: 'outbox_relay_publish_delay_seconds_bucket{relay="billing.recheck", le="+Inf"}'
        values: '0+100x60'
      # 미발행은 10분 동안 50건, 그 뒤 150건이다
      - series: 'outbox_relay_backlog{job="batch", instance="b1", relay="adserving.impression"}'
        values: '50x10 150x50'
      # 포기한 건은 10분 뒤 2건이 생긴다
      - series: 'outbox_relay_abandoned{job="batch", instance="b1", relay="adserving.impression"}'
        values: '0x10 2x50'
      # 실행 단위 실패는 10분 뒤부터 매분 1건이다
      - series: 'adserving_impression_dispatch_error_total{job="batch", instance="b1"}'
        values: '0x10 1+1x50'
    alert_rule_test:
      - eval_time: 15m
        alertname: RelayPublishDelayHigh
        exp_alerts: []
      - eval_time: 40m
        alertname: RelayPublishDelayHigh
        exp_alerts:
          - exp_labels: {severity: warning, relay: adserving.impression}
            exp_annotations: {description: "릴레이 adserving.impression 의 발행 지연 p99 가 10분 넘게 기준을 넘었다. 06 처리 시간 목표 초과의 릴레이 줄에서 실행 트레이스를 확인하라"}
      # 적체는 11분부터 100건을 넘고 10분 지속 뒤 울린다
      - eval_time: 15m
        alertname: RelayBacklogHigh
        exp_alerts: []
      - eval_time: 25m
        alertname: RelayBacklogHigh
        exp_alerts:
          - exp_labels: {severity: warning, relay: adserving.impression}
            exp_annotations: {description: "릴레이 adserving.impression 의 미발행이 150 건이다. 기준은 100건이다. 06 의 릴레이 줄에서 발행 지연과 포기한 건수를, 배치 로그에서 실행 실패를 확인하라"}
      # 포기한 건은 기다리지 않고 곧바로 울린다
      - eval_time: 5m
        alertname: RelayAbandoned
        exp_alerts: []
      - eval_time: 11m
        alertname: RelayAbandoned
        exp_alerts:
          - exp_labels: {severity: warning, relay: adserving.impression}
            exp_annotations: {description: "릴레이 adserving.impression 가 2 건의 넘기기를 포기했다. 원인을 고친 뒤 포기 시각을 비워 다시 넘겨라"}
      - eval_time: 15m
        alertname: AdservingDispatchError
        exp_alerts: []
      - eval_time: 25m
        alertname: AdservingDispatchError
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {description: "노출 릴레이가 10분 넘게 실행 단위로 실패하고 있다. 정산의 DB 와 Valkey, 배치 로그를 확인하라"}

  # 마감이 지난 미발행(lc-infra #150). 30분 뒤 3건이 새로 생기고 그대로 남는다. 늘어난 뒤 1시간 동안만 울리고 그 뒤로는 남아 있어도 울리지 않는다.
  - interval: 1m
    input_series:
      - series: 'adserving_impression_dispatch_expired{job="batch", instance="b1"}'
        values: '0x30 3x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: AdservingImpressionExpired
        exp_alerts: []
      - eval_time: 40m
        alertname: AdservingImpressionExpired
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {description: "마감이 지나 넘기지 못한 노출이 1시간 사이 늘었다. 과금되지 않는다. 배치 서버와 노출 릴레이가 하루 넘게 멈췄는지 확인하라"}
      - eval_time: 100m
        alertname: AdservingImpressionExpired
        exp_alerts: []

  # 재시작을 흉내 낸다. 처음부터 3건이 남아 있고 늘지 않아 울리지 않는다
  - interval: 1m
    input_series:
      - series: 'adserving_impression_dispatch_expired{job="batch", instance="b2"}'
        values: '3x120'
    alert_rule_test:
      - eval_time: 5m
        alertname: AdservingImpressionExpired
        exp_alerts: []
      - eval_time: 90m
        alertname: AdservingImpressionExpired
        exp_alerts: []

  # 릴레이 경보의 해소와 카운터 초기화(lc-infra #150). 앞의 시험은 기준을 넘은 채로 끝나 해소를 보지 못한다.
  # 발행 지연은 10~40분에만 느리고, 미발행과 포기는 10~40분에만 넘고, 실행 실패는 10~40분에만 오른다. 실행 실패 카운터는 25분에 재시작으로 0 이 된다.
  - interval: 1m
    input_series:
      - series: 'overrun_threshold_seconds{kind="relay", name="default"}'
        values: '5x120'
      # 버킷이 5.0 과 +Inf 뿐이면 histogram_quantile 이 마지막 유한 상한(5)을 돌려줘 기준을 넘지 못한다. 실제 지표처럼 위 버킷을 둔다
      - series: 'outbox_relay_publish_delay_seconds_bucket{relay="adserving.impression", le="5.0"}'
        values: '0+100x10 1000x30 1000+100x80'
      - series: 'outbox_relay_publish_delay_seconds_bucket{relay="adserving.impression", le="10.0"}'
        values: '0+100x120'
      - series: 'outbox_relay_publish_delay_seconds_bucket{relay="adserving.impression", le="+Inf"}'
        values: '0+100x120'
      - series: 'outbox_relay_backlog{job="batch", instance="b1", relay="adserving.impression"}'
        values: '10x10 150x30 10x80'
      - series: 'outbox_relay_abandoned{job="batch", instance="b1", relay="adserving.impression"}'
        values: '0x10 2x30 0x80'
      - series: 'adserving_impression_dispatch_error_total{job="batch", instance="b1"}'
        values: '0x10 1+1x14 0+1x15 15x80'
    alert_rule_test:
      # 평소: 아무것도 울리지 않는다
      - eval_time: 5m
        alertname: RelayPublishDelayHigh
        exp_alerts: []
      - eval_time: 5m
        alertname: RelayBacklogHigh
        exp_alerts: []
      - eval_time: 5m
        alertname: RelayAbandoned
        exp_alerts: []
      - eval_time: 5m
        alertname: AdservingDispatchError
        exp_alerts: []
      # 카운터가 25분에 0 으로 돌아가도 increase 가 재시작을 이어 붙여 계속 울린다
      - eval_time: 30m
        alertname: AdservingDispatchError
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {description: "노출 릴레이가 10분 넘게 실행 단위로 실패하고 있다. 정산의 DB 와 Valkey, 배치 로그를 확인하라"}
      # 해소를 보기 전에, 같은 입력에서 실제로 울리는지 본다
      - eval_time: 35m
        alertname: RelayPublishDelayHigh
        exp_alerts:
          - exp_labels: {severity: warning, relay: adserving.impression}
            exp_annotations: {description: "릴레이 adserving.impression 의 발행 지연 p99 가 10분 넘게 기준을 넘었다. 06 처리 시간 목표 초과의 릴레이 줄에서 실행 트레이스를 확인하라"}
      - eval_time: 35m
        alertname: RelayBacklogHigh
        exp_alerts:
          - exp_labels: {severity: warning, relay: adserving.impression}
            exp_annotations: {description: "릴레이 adserving.impression 의 미발행이 150 건이다. 기준은 100건이다. 06 의 릴레이 줄에서 발행 지연과 포기한 건수를, 배치 로그에서 실행 실패를 확인하라"}
      - eval_time: 35m
        alertname: RelayAbandoned
        exp_alerts:
          - exp_labels: {severity: warning, relay: adserving.impression}
            exp_annotations: {description: "릴레이 adserving.impression 가 2 건의 넘기기를 포기했다. 원인을 고친 뒤 포기 시각을 비워 다시 넘겨라"}
      # 해소: 40분 뒤 정상으로 돌아오면 모두 그친다
      - eval_time: 60m
        alertname: RelayPublishDelayHigh
        exp_alerts: []
      - eval_time: 60m
        alertname: RelayBacklogHigh
        exp_alerts: []
      - eval_time: 60m
        alertname: RelayAbandoned
        exp_alerts: []
      - eval_time: 60m
        alertname: AdservingDispatchError
        exp_alerts: []

  # 릴레이 지표가 아예 없으면(릴레이가 아직 없거나 배치가 지표를 내지 않음) 아무것도 울리지 않는다
  - interval: 1m
    input_series:
      - series: 'overrun_threshold_seconds{kind="relay", name="default"}'
        values: '5x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: RelayPublishDelayHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: RelayBacklogHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: RelayAbandoned
        exp_alerts: []
      - eval_time: 20m
        alertname: AdservingDispatchError
        exp_alerts: []
      - eval_time: 20m
        alertname: AdservingImpressionExpired
        exp_alerts: []

  # 비동기 워커 경보(lc-infra #151). 노출은 매분 1,000건 받고, 10분 뒤부터 매분 5건을 버린다(0.5%).
  # 노출 저장 워커의 대기 시간은 10분 뒤부터 30초다. 서빙 로그 워커는 이름별 기준(60초)이라 같은 30초에도 울리지 않는다.
  - interval: 1m
    input_series:
      - series: 'overrun_threshold_seconds{kind="worker", name="default"}'
        values: '5x40'
      - series: 'overrun_threshold_seconds{kind="worker", name="adserving.serve-log-write"}'
        values: '60x40'
      - series: 'http_server_requests_seconds_count{job="app", instance="a1", uri="/v1/impressions", status="202"}'
        values: '0+1000x40'
      - series: 'adserving_impression_dropped_total{job="app", instance="a1"}'
        values: '0x10 5+5x30'
      - series: 'async_worker_oldest_age_seconds{job="app", instance="a1", worker="adserving.impression-write"}'
        values: '1x10 30x30'
      - series: 'async_worker_oldest_age_seconds{job="app", instance="a1", worker="adserving.serve-log-write"}'
        values: '1x10 30x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: WorkerWaitHigh
        exp_alerts: []
      - eval_time: 17m
        alertname: WorkerWaitHigh
        exp_alerts:
          - exp_labels: {severity: warning, worker: adserving.impression-write}
            exp_annotations: {description: "워커 adserving.impression-write 의 대기열이 5분 넘게 기준보다 오래 기다린다. 곧 차서 일을 버린다. 06 처리 시간 목표 초과의 워커 줄을 확인하라"}
      - eval_time: 15m
        alertname: AdservingImpressionLossHigh
        exp_alerts: []
      - eval_time: 35m
        alertname: AdservingImpressionLossHigh
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {description: "노출 유실률이 0.5% 다. 목표는 0.1% 미만이다. 버린 노출은 과금되지 않는다. 노출 저장 워커의 대기 시간과 카운터 호출을 확인하라"}

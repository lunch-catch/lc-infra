# 알람 규칙. 값의 근거는 백엔드공통_알람과알림_설계.md 5절에 있다.
# 문서가 (미정) 으로 둔 것은 파일 끝에 자리만 남겨 두었다. 측정 전에 값을 지어내지 않는다.
groups:
  - name: watchdog
    rules:
      # 알림이 오지 않는 것을 감지할 수단이다 (INF-33).
      # 항상 발화하며 5분마다 재발송된다. 이것이 끊기면 파이프라인이 죽은 것이다.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: watchdog
        annotations:
          description: "알림 파이프라인이 살아 있다"

  - name: critical
    rules:
      # 메모리가 다 차서 쓰기가 거절됐다. 로그인 상태, 쿠폰 순번, 과금 쓰기가 실패하고 있다
      - alert: CacheOomRejected
        expr: increase(redis_errors_total{err="OOM"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          description: "캐시가 메모리 부족으로 쓰기를 거절했다. 키를 정리하거나 노드를 키워라"

      # 배포 전 대비 2배, 3분 지속. 롤백 판단의 근거다.
      - alert: HighFiveXXRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[3m]))
          /
          sum(rate(http_server_requests_seconds_count[3m]))
          >
          2 * sum(rate(http_server_requests_seconds_count{status=~"5.."}[3m] offset 1h))
          /
          sum(rate(http_server_requests_seconds_count[3m] offset 1h))
        for: 3m
        labels:
          severity: critical
        annotations:
          description: "5xx 비율이 한 시간 전 대비 2배를 넘었다. 롤백을 판단하라"

      # 배치가 한 대도 살아 있지 않다. 00:00 묶음과 쿠폰 만료가 돌지 않는다.
      #
      # BatchNotRun 으로는 못 잡는다. 그것은 성공 시각이 낡는 것을 보는데, 서버가 죽으면
      # 지표 자체가 사라져 비교할 값이 없다. 그래서 수집 대상이 살아 있는지를 따로 본다.
      # absent 는 대상이 모두 사라져 up 시계열마저 없을 때(인스턴스 종료)를 잡는다.
      #
      # 배포는 한 대씩 교체하므로 정상 배포로는 0대가 되지 않는다.
      - alert: BatchAllDown
        expr: |
          absent(up{job="batch"} == 1)
        for: 3m
        labels:
          severity: critical
        annotations:
          description: "살아 있는 배치 서버가 없다. 영업일 경계 작업이 돌지 않는다"

  - name: warning
    rules:
      # CPU 크레딧은 잔량이 아니라 초과분을 본다 (2026-10-06).
      #
      # 인스턴스가 전부 unlimited 모드라 크레딧이 말라도 느려지지 않는다. 돈이 나가는 것은
      # 잔량을 다 쓰고 초과분(surplus)을 빌려 쓴 뒤 그것을 갚지 못할 때다.
      #
      # 전에는 잔량이 최대 누적량의 30%(173)와 10%(58) 아래인지 봤다. 그런데 unlimited 인스턴스는
      # 크레딧 0 에서 시작하고 시간당 24 씩 쌓여 173 까지 7시간이 걸린다. 재구축이나 배포, ASG 교체로
      # 새 인스턴스가 뜰 때마다 CPU 를 거의 안 써도 두 알람이 몇 시간씩 울렸다. 과금과 무관한 소음이다.
      #
      # 지표는 cloudwatch_exporter 가 AWS/EC2 에서 가져온다. 하이퍼바이저가 관리하는 값이라
      # node_exporter 로는 볼 수 없다.

      # 초과분을 한 시간 넘게 들고 있다. 기준선보다 오래 바쁘다는 뜻이고, 24시간 안에 적립으로
      # 갚지 못하면 과금된다 (vCPU 시간당 0.05 USD).
      #
      # 한 시간을 기다리는 것은 기동 때문이다. 크레딧 0 으로 뜬 인스턴스는 부팅과 JVM 기동만으로
      # 잠깐 초과분을 쓰고, t3.small 은 분당 0.4 씩 적립해 30분 안에 갚는다.
      - alert: CpuSurplusCreditInUse
        expr: aws_ec2_cpusurplus_credit_balance_average > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          description: "{{ $labels.instance_id }} 가 한 시간 넘게 초과분 크레딧을 쓰고 있다. 기준선보다 바쁜 원인을 확인하라"

      # 초과분이 실제로 과금됐다. 24시간 안에 갚지 못했거나 초과분을 든 채 종료된 것이다.
      - alert: CpuSurplusCreditCharged
        expr: aws_ec2_cpusurplus_credits_charged_sum > 0
        labels:
          severity: warning
        annotations:
          description: "{{ $labels.instance_id }} 의 초과분 크레딧이 과금됐다. 부하 원인을 확인하라"

      # 풀 크기 10 의 90%. 대기가 쌓이면 톰캣 스레드가 먼저 마른다.
      - alert: HikariPendingHigh
        expr: hikaricp_connections_pending > 9
        for: 2m
        labels:
          severity: warning
        annotations:
          description: "커넥션 풀 대기가 90% 를 넘었다. slow query 를 확인하라"

      # 풀에서 커넥션을 시간 제한(앱의 connection-timeout) 안에 얻지 못해 요청이 실패했다. 정상이면 0 이다.
      # 시간 제한 값은 앱 설정 한 곳에만 둔다. 여기서는 걸린 횟수만 본다(#111).
      - alert: HikariConnectionTimeout
        expr: sum by (instance, instance_id) (increase(hikaricp_connections_timeout_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          description: "{{ $labels.instance }} 에서 커넥션을 시간 제한 안에 얻지 못해 요청이 실패했다. 풀 크기와 오래 쥔 커넥션을 확인하라"

      # 커넥션을 1초 넘게 쥔 사용이 1% 를 넘었다. 품질 문서 데이터 무결성의 트랜잭션 상한 1초다(#108).
      # 1초가 버킷 경계라 p99 > 1초와 같은 뜻이고 어림이 없다. 건수가 적으면 한두 건으로 튀어 5분에 100건 넘게 쓴 풀만 본다
      - alert: TransactionSlow
        expr: |
          (
            sum by (job, instance, instance_id) (increase(hikaricp_connections_usage_seconds_count[5m]))
            - sum by (job, instance, instance_id) (increase(hikaricp_connections_usage_seconds_bucket{le="1.0"}[5m]))
          )
          / sum by (job, instance, instance_id) (increase(hikaricp_connections_usage_seconds_count[5m])) > 0.01
          and sum by (job, instance, instance_id) (increase(hikaricp_connections_usage_seconds_count[5m])) >= 100
        for: 5m
        labels:
          severity: warning
        annotations:
          description: "{{ $labels.instance }} 에서 커넥션을 1초 넘게 쥔 사용이 1% 를 넘었다. 03 의 트랜잭션 시간과 누수 감지 경고 로그로 오래 쥔 코드를 확인하라"

      # GC 만 하고 일을 못 하는 상태다. 메모리가 모자라기 시작한 가장 이른 신호다(#108).
      # 10% 는 실무에서 흔한 범위(10~20%)의 아래쪽이다. 로컬의 부하 시험 환경 흉내 구성에서 평소의 1분 최대는 1.1% 였다.
      # 03 의 선은 thresholds.yml 의 gc-overhead 에서 읽는다. 문턱을 고치면 그쪽도 같이 고친다
      - alert: GcOverheadHigh
        expr: sum by (job, instance, instance_id) (rate(jvm_gc_pause_seconds_sum[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          description: "{{ $labels.instance }} 가 5분 넘게 시간의 10% 넘게 GC 로 멈췄다. GC 뒤에 남은 힙을 확인하라"

      # GC 를 해도 힙이 비워지지 않는다. 그대로 가면 OutOfMemoryError 로 죽는다(#108).
      # 03 의 선은 품질 문서의 70% 이고, 경보는 평소 부하에 울리지 않게 85% 로 나눈다.
      # 앱이 막 떠 아직 GC 를 하지 않으면 최대 크기가 0 이라 그때는 뺀다
      - alert: HeapAfterGcHigh
        expr: max by (job, instance, instance_id) (jvm_gc_live_data_size_bytes / (jvm_gc_max_data_size_bytes > 0)) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          description: "{{ $labels.instance }} 의 GC 뒤에 남은 힙이 10분 넘게 85% 를 넘었다. 메모리 누수와 힙 크기를 확인하라"

      # 캐시는 Degradable 이라 죽어도 서비스는 돈다. 강등 경로가 실제로 동작하는지 확인한다.
      - alert: CacheConnectionFailed
        expr: redis_up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          description: "캐시 연결이 1분간 끊겼다. 강등 경로 동작을 확인하라"

      # 퇴출 정책이 noeviction 이라 메모리가 차면 쓰기가 오류가 된다. 차기 전에 알린다
      - alert: CacheMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.7
        for: 5m
        labels:
          severity: warning
        annotations:
          description: "캐시 메모리가 70% 를 넘었다. TTL 없는 키와 키 개수를 확인하라"

      # 10분 내 3회. OOM 이 가장 흔한 원인이다.
      - alert: ContainerRestartLoop
        expr: changes(container_start_time_seconds[10m]) >= 3
        labels:
          severity: warning
        annotations:
          description: "컨테이너가 10분 내 3회 재기동했다. OOM 여부를 확인하라"

      - alert: DiskUsageHigh
        expr: |
          100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
                 / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          description: "디스크 사용률이 80% 를 넘었다. 로그를 정리하라"

      # 배포 절차가 신규 인스턴스를 최대 6분 기다린다. 90초를 넘으면 먼저 알린다.
      - alert: ReadinessSlow
        expr: |
          probe_success{job="app"} == 0
        for: 90s
        labels:
          severity: warning
        annotations:
          description: "readiness 가 90초 넘게 실패했다. 배포를 중단하라"

      # 배치 두 대 중 한 대가 죽었다. 남은 한 대가 작업을 이어받아 지금은 돌지만,
      # 그것마저 죽으면 끝이라 알아야 한다. 이것이 없으면 두 번째 장애 때 처음 알게 된다.
      #
      # 5분을 기다리는 것은 배포 때문이다. deploy.sh 가 한 대씩 재시작하고 기동에 1분 남짓 걸린다.
      - alert: BatchDegraded
        expr: |
          count(up{job="batch"} == 1) < 2
        for: 5m
        labels:
          severity: warning
        annotations:
          description: "배치 서버가 {{ $value }} 대만 살아 있다. 나머지 한 대를 확인하라"

      # 배치가 조용히 멈추는 것을 잡는다.
      #
      # 배치 인스턴스는 ALB 대상이 아니라 HealthyHostCount 에 안 걸린다.
      # 에러 알람은 작업이 돌아야 울리므로 프로세스가 아예 안 뜨면 아무 신호도 없다.
      # 그래서 실패가 아니라 마지막 성공 시각이 낡는 것으로 감시한다.
      #
      # 주기가 작업마다 달라 임계값을 넷으로 나눈다 (lc-infra #44).
      # 임계값은 다음 실행까지의 간격이 아니라 마지막 성공 뒤 허용하는 시간이다.
      #   30분: 생존 신호(30초), 이어받기(1분), 쿠폰 만료(5분), 후보 예산 갱신(10분). 30분이면 여러 번을 연달아 놓친 것이다
      #   5분: 결제 재조회(1분 간격), 충전 재예약(1분 간격), 노출 릴레이(1초 간격). 멈추면 승인 결과를 모르는 결제가 확정되지 않고, 충전한 광고주의 예약이 다시 잡히지 않고, 유효 노출이 정산에 넘어가지 않아 차감이 멈춘다
      #   50시간: 이벤트 보존(04:00). 하루 놓쳐도 장애가 아니고 다음 날 몰아서 지운다
      #   25시간: 그 밖의 작업. 00:00 묶음, 01:00 집계, 01:30 PG 대사, 02:00 쿠폰 정합과 광고 로그 보존,
      #           03:00 쿠폰 준비와 카카오 연결 해제 재시도, 04:00 템플릿 버전 정리, 10:55 쿠폰 대기열, 11:00 발급 시작, 14:00 발급 마감
      #           하루 한 번 도는 작업을 30분으로 두면 성공한 지 30분 뒤부터 매일 울린다. 2026-10-26 운영에서 9개가 이렇게 울렸다
      # 새 작업은 기본으로 25시간에 들어간다. 분 단위로 도는 작업을 더하면 30분 목록에 이름을 넣는다.
      #
      # 서버마다 따로 본다. 점유하지 못한 서버의 묶음도 "다른 서버가 잡았다" 로 정상 종료해
      # 성공 시각이 갱신되므로, 한 대만 낡으면 그 서버의 스케줄러가 멈춘 것이다.
      # 시계열은 기동 뒤 첫 성공 때 생긴다. 재시작 뒤 아직 한 번도 돌지 않은 하루 작업은 시계열이 없어 울리지 않는다.
      - alert: BatchNotRun
        expr: |
          (time() - batch_job_last_success_timestamp_seconds{scheduler=~".*\\.(sendHeartbeat|takeOverStale|expireCoupons)\\(\\).*|.*CandidateBudgetRefreshJob\\.refresh\\(\\).*"} > 1800)
          or
          (time() - batch_job_last_success_timestamp_seconds{scheduler=~".*\\.(recheckUnknownPayments|reserveCharged|dispatchPending)\\(\\).*"} > 300)
          or
          (time() - batch_job_last_success_timestamp_seconds{scheduler=~".*\\.purgeExpiredEvents\\(\\).*"} > 180000)
          or
          (time() - batch_job_last_success_timestamp_seconds{scheduler!~".*\\.(sendHeartbeat|takeOverStale|expireCoupons|recheckUnknownPayments|reserveCharged|dispatchPending|purgeExpiredEvents)\\(\\).*|.*CandidateBudgetRefreshJob\\.refresh\\(\\).*"} > 90000)
        for: 5m
        labels:
          severity: warning
        annotations:
          description: "배치 {{ $labels.instance }} 의 {{ $labels.scheduler }} 가 주기를 넘겨 성공하지 못했다"

  # 광고 서빙이 장애 때 막지 않고 통과시키거나 버린 횟수다 (lc-infra #4).
  #
  # 넷 다 정상 운영에서는 0 이어야 하는 값이다. Valkey 가 아예 죽은 것은 CacheConnectionFailed 가 알리고,
  # 여기서는 Valkey 는 살아 있는데 명령이 실패하거나 시간이 초과된 경우까지 잡는다.
  #
  # 한 번 튄 실패로는 울리지 않는다. increase[5m] 는 실패 한 건에도 5분 동안 양수라서
  # for 를 10분으로 두면 실패가 5분 넘게 이어질 때만 울린다.
  - name: adserving
    rules:
      # use 별로 따로 알린다. 어느 규칙이 빠졌는지 알림만 보고 안다.
      #   feed_rate_limit   요청 제한이 풀린다
      #   daily_exclusion   넘긴 카드가 다시 보인다
      #   serve_frequency, impression_count   노출 상한이 늦게 걸린다
      #   serve_record      그동안의 노출이 무효가 되어 과금되지 않는다
      - alert: AdservingCacheBypass
        expr: |
          sum by (use) (increase(adserving_cache_bypass_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          description: "광고 서빙이 {{ $labels.use }} 규칙을 10분 넘게 건너뛰고 있다. Valkey 명령 실패를 확인하라"

      # 예산을 넘긴 캠페인도 피드에 나간다. 정산의 예산 진행률 조회를 확인한다.
      - alert: AdservingBudgetUnavailable
        expr: |
          sum(increase(adserving_budget_unavailable_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          description: "예산 진행률을 읽지 못해 예산 규칙 없이 피드를 내보내고 있다. 예산을 넘긴 캠페인도 노출된다"

      # 서빙 로그 유실률. 목표가 0.1% 미만이다 (lc-backend docs/design/adserving/feed-api-design.md).
      #
      # 버린 것과 쓰기에 실패한 것을 합쳐 내려준 카드 수로 나눈다. 카운터는 처음 오를 때 생기므로
      # 한쪽이 아직 없으면 0 으로 채운다. 그러지 않으면 덧셈 결과가 비어 알람이 영영 서지 않는다.
      # 내려준 카드가 0 이면 분모를 비워 0 으로 나누지 않는다.
      - alert: AdservingServeLogLossHigh
        expr: |
          (
            (sum(increase(adserving_serve_log_dropped_total[10m])) or vector(0))
            +
            (sum(increase(adserving_serve_log_failed_total[10m])) or vector(0))
          )
          /
          (sum(increase(adserving_served_cards_total[10m])) > 0)
          > 0.001
        for: 10m
        labels:
          severity: warning
        annotations:
          description: "서빙 로그 유실률이 {{ $value | humanizePercentage }} 다. 목표는 0.1% 미만이다. 관리자 진단에 기록 없음이 는다"

      # 추천 인원(FR-042)이 줄 수 있다. 분모로 삼을 지표가 없어 0 을 넘는지만 본다.
      - alert: AdservingFeedVisitWriteFailed
        expr: |
          sum(increase(adserving_feed_visit_failed_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          description: "feed_visit_daily 쓰기가 10분 넘게 실패하고 있다. 추천 인원이 줄 수 있다"

      # 노출 릴레이의 실행 하나가 통째로 실패했다. 정산이 예외를 던졌거나(DB, Valkey 장애) 밀린 수를 못 셌거나 임대를 확인하지 못했다.
      # 노출마다의 실패(adserving_impression_dispatch_failed_total)는 다시 넘기니 경보를 두지 않는다. 끝내 실패하면 RelayAbandoned 가 잡는다
      - alert: AdservingDispatchError
        expr: |
          sum(increase(adserving_impression_dispatch_error_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          description: "노출 릴레이가 10분 넘게 실행 단위로 실패하고 있다. 정산의 DB 와 Valkey, 배치 로그를 확인하라"

      # adserving_impression_campaign_mismatch_total 은 알람을 두지 않는다.
      # 클라이언트 버그나 조작된 요청이고 판정은 serve 기록으로 하므로 서비스는 맞게 돈다.
      # 대시보드 06 의 패널로 본다.

  # 정산 경보의 1차다 (lc-infra #43). 평소 0 이어야 하는 지표만 건다.
  #
  # 카운터는 백엔드가 기동 때 0 으로 등록한다(lc-backend #1027). 처음 오를 때 시계열이 생기면
  # increase 가 그 첫 건을 0 에서 1 로 보지 못해 놓친다.
  #
  # 하루 한두 번 도는 작업(01:30 PG 대사)이 내는 값이라 창을 1시간으로 둔다. 짧게 잡으면
  # 평가 주기 사이에 증가분이 사라져 알림이 서기 전에 해소된다. for 는 두지 않는다. 한 건이 곧 사고다.
  # 비율과 건수 임계를 쓰는 2차는 운영에서 1 ~ 2주 본 뒤 정한다.
  - name: billing
    rules:
      # 승인 결과를 모르는 결제를 정해진 횟수만큼 다시 물었는데도 결과를 얻지 못했다. 사람이 PG 화면에서 확인해야 한다.
      - alert: BillingRecheckExhausted
        expr: |
          sum(increase(billing_payment_recheck_exhausted_total[1h])) > 0
        labels:
          severity: warning
        annotations:
          description: "결제 재조회를 다 쓰고도 승인 결과를 모르는 결제가 생겼다. PG 관리자 화면에서 상태를 확인하고 손으로 확정하라"

      # PG 와 우리 기록이 어긋났다. mismatch 는 맞추지 못한 것이고 recovered 는 자동으로 맞춘 것이다.
      # 자동 복구도 원인이 있어 알린다. 둘을 나눠 어느 쪽인지 알림만 보고 안다.
      - alert: BillingPgReconMismatch
        expr: |
          sum by (result) (increase(billing_pg_recon_total{result=~"mismatch|recovered"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          description: "PG 대사에서 {{ $labels.result }} 가 나왔다. mismatch 는 손으로 맞추고, recovered 는 어긋난 원인을 확인하라"

  # 분석 경보의 1차다 (lc-infra #43). 정산과 같은 이유로 평소 0 이어야 하는 것만 건다.
  #
  # 집계는 배치 서버만 돈다. API 서버도 같은 게이지를 내지만 늘 0 이라 job="batch" 로 좁힌다.
  # 개발 환경은 API 와 배치를 job="app" 하나로 긁어 이 규칙들이 울리지 않는다. 개발 확인은 rules_test.yml 로 한다.
  - name: analytics
    rules:
      # 01:00 일 집계가 실패했다. 다음 날 실행이 밀린 날짜를 함께 다시 집계하지만 그동안 통계가 비어 보인다.
      - alert: AnalyticsAggregationFailed
        expr: |
          sum(increase(analytics_aggregation_total{result="failed"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          description: "일 집계가 실패했다. 배치 로그의 ANALYTICS_DAILY_AGGREGATION 이벤트로 원인을 확인하라"

      # 집계하지 못하고 밀린 날짜 수다. 하루 실패는 다음 실행이 메운다. 3일 이상이면 그것이 반복해서 실패하고 있다.
      # 서버마다 값이 있어 max 로 묶는다. 더하면 배치 두 대가 같은 날짜를 두 번 센다.
      - alert: AnalyticsPendingDatesHigh
        expr: |
          max(analytics_aggregation_pending_dates{job="batch"}) >= 3
        for: 10m
        labels:
          severity: critical
        annotations:
          description: "집계하지 못한 날짜가 {{ $value }} 일 쌓였다. 일 집계가 며칠째 실패하고 있다. 통계 화면이 그만큼 비어 있다"

      # 집계 결과의 정합성 검사가 위반을 찾았다.
      #
      # 게이지는 집계를 돈 서버에만 생기고 다음 실행까지 값을 유지한다. 백엔드가 집계를 시작할 때 0 으로 다시 쓰지만
      # 다른 서버에 남은 옛 값은 지워지지 않는다. 그래서 마지막으로 집계에 성공한 서버 한 대의 값만 본다.
      - alert: AnalyticsConsistencyViolation
        expr: |
          max by (check) (
            analytics_consistency_violations{job="batch"}
            and on (instance_id)
            topk(1, batch_job_last_success_timestamp_seconds{job="batch", scheduler=~".*DailyAggregationJob\\.run\\(\\).*"})
          ) > 0
        labels:
          severity: warning
        annotations:
          description: "집계 정합성 검사 {{ $labels.check }} 가 위반 {{ $value }} 건을 찾았다. 집계 결과를 믿기 전에 원천 데이터와 맞춰 보라"

  # 아웃박스 릴레이의 결과를 본다(lc-infra #150). 지표는 모든 릴레이가 내는 공통 이름이라 relay 꼬리표로 나눈다.
  # 새 릴레이가 생겨도 규칙을 고치지 않는다. 멈춤은 BatchNotRun, 실행 실패는 도메인마다의 오류 카운터가 본다.
  - name: relay
    rules:
      # 넘긴 순간에 잰 발행 지연의 p99 가 그 릴레이의 기준을 넘었다. 기준은 앱의 기준 지표이고 기본값은 품질 문서의 아웃박스 발행 지연 5초다
      - alert: RelayPublishDelayHigh
        expr: |
          histogram_quantile(0.99, sum by (relay, le) (rate(outbox_relay_publish_delay_seconds_bucket[5m])))
          > on(relay) group_left()
          (
            max by (relay) (label_replace(overrun_threshold_seconds{kind="relay", name!="default"}, "relay", "$1", "name", "(.+)"))
            or
            histogram_quantile(0.99, sum by (relay, le) (rate(outbox_relay_publish_delay_seconds_bucket[5m]))) * 0
              + scalar(max(overrun_threshold_seconds{kind="relay", name="default"}))
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          description: "릴레이 {{ $labels.relay }} 의 발행 지연 p99 가 10분 넘게 기준을 넘었다. 06 처리 시간 목표 초과의 릴레이 줄에서 실행 트레이스를 확인하라"

      # 품질 문서의 아웃박스 미발행 적체(100건 초과 시 경보)다. 포기한 건은 빠지고 다시 넘길 시각을 기다리는 건은 든다
      - alert: RelayBacklogHigh
        expr: |
          max by (relay) (outbox_relay_backlog) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          description: "릴레이 {{ $labels.relay }} 의 미발행이 {{ $value }} 건이다. 기준은 100건이다"

      # 상한만큼 실패해 넘기기를 포기한 건이 있다. 데드레터처럼 사람이 원인을 고쳐야 줄어드니 기다리지 않고 곧바로 울린다
      - alert: RelayAbandoned
        expr: |
          max by (relay) (outbox_relay_abandoned) > 0
        labels:
          severity: warning
        annotations:
          description: "릴레이 {{ $labels.relay }} 가 {{ $value }} 건의 넘기기를 포기했다. 원인을 고친 뒤 포기 시각을 비워 다시 넘겨라"

  # 임계값이 정해지지 않은 알람들. 부하 시험 후 채운다.
  #
  # - alert: FiveZeroTwo            502 발생. (미정) 초과
  # - alert: RdsFreeableMemoryLow   RDS 여유 메모리. (미정) 미만
  # - alert: TomcatThreadsHigh      톰캣 스레드 사용률. (미정)% 초과
  # - alert: ConsumedLcuHigh        ConsumedLCUs. (미정) 초과
  # - alert: P99Slow                p99 응답시간. 기준선 대비 3배. 기준선이 없다
  # - alert: IntegrityCheckFailed   정합성 검증 실패. 검증 쿼리 결과를 내보내는 경로가 없다

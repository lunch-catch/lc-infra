# 앱 지표는 15초로 긁는다. 페일오버 2분이나 인스턴스 전환 30초 같은 짧은 사건을 보려면 이 해상도가 필요하다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: lunchcatch
    # 경보를 보낸 환경이다 (#161). 같은 Slack 채널에 운영과 팀원 부하 시험 환경의 경보가 섞여도 Alertmanager 가 제목에 붙여 구분한다.
    # 값은 compose 가 넘기는 ALERT_ENV 이고 refresh-monitoring-env 가 SSM 에서 만든다. Prometheus 3 은 이 자리의 ${} 를 환경 변수로 푼다.
    env: ${ALERT_ENV}

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules.yml
  # API 와 백그라운드 작업 대시보드가 읽는 기준이다. 알람이 아니라 기준 값을 시계열로 만든다
  - /etc/prometheus/thresholds.yml
  # SLI 대시보드가 읽는 API 의 성공 비율과 목표 안 비율이다
  - /etc/prometheus/sli.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Alertmanager 가 알림을 보내지 못한 수를 본다(lc-infra #171). 모니터링 자체가 도는지 확인하는 메타 모니터링이다
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # 로그를 받는 구성 요소다(lc-infra #171). 죽으면 로그가 조용히 빠지므로 TargetDown 이 보게 수집한다.
  # Pyroscope 는 profiling 프로필을 켠 때만 떠 수집하지 않는다. 늘 수집하면 켜지 않은 환경에서 TargetDown 이 늘 울린다
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # 추적 저장소다(lc-infra #185). 죽으면 트레이스가 조용히 빠지므로 TargetDown 이 보게 수집한다.
  # 추적을 켠 환경에서만 뜬다. refresh-monitoring-env 가 켠 환경에만 대상을 적고 끈 환경에는 빈 목록을 적어, 끈 환경에서 TargetDown 이 울리지 않는다
  - job_name: tempo
    file_sd_configs:
      - files: ["/etc/prometheus/targets/tempo.yml"]

  # 모니터링 서버와 앱, 배치 서버의 Alloy 다. 앱과 배치는 Role 태그로 골라 Alloy 가 없는 부하 생성기를 빼고, instance 는 node 와 같은 꼴로 붙인다
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
        labels: {instance: monitoring}
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 12345
        filters:
          - name: instance-state-name
            values: [running]
          - name: tag:Role
            values: [app, batch]
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Name]
        regex: (.+)
        target_label: instance
      - source_labels: [__meta_ec2_instance_id]
        regex: (.+)
        target_label: instance_id

  # 앱은 ASG 가 교체하므로 주소가 바뀐다. 정적 목록을 쓸 수 없다.
  # EC2 서비스 디스커버리로 태그를 보고 찾는다.
  #
  # instance 는 EC2 의 Name 태그다. 한 역할의 여러 대가 같은 이름을 갖는다.
  # 그래서 instance_id 를 함께 남긴다. 없으면 3대가 같은 범례로 겹쳐 보여
  # 그중 한 대만 이상한 경우를 못 가린다.
  #
  # 앱은 지금 1대라 안 드러나지만 오토스케일링으로 3대까지 는다 (INF-39).
  #
  - job_name: app
    metrics_path: /actuator/prometheus
    # 부하로 CPU 가 바닥나면 지표 응답이 10초(기본값)를 넘는다. 수집 간격과 같게 두어 늦은 칸을 건진다. 늘려도 수집은 겹치지 않는다(#159)
    scrape_timeout: 15s
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 8081
        filters:
          - name: tag:Role
            values: [app]
          - name: instance-state-name
            values: [running]
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance_id

  - job_name: batch
    metrics_path: /actuator/prometheus
    # 앱과 같은 까닭이다(#159)
    scrape_timeout: 15s
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 8081
        filters:
          - name: tag:Role
            values: [batch]
          - name: instance-state-name
            values: [running]
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance
      # 배치는 두 대이고 교체되면 id 가 바뀐다. 어느 서버가 묶음을 잡았는지와 회차 비교에 그 구분이 필요하다.
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance_id

  # 호스트 지표. CPU 크레딧이 여기서 나온다.
  - job_name: node
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 9100
        filters:
          - name: instance-state-name
            values: [running]
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance
      - source_labels: [__meta_ec2_tag_Role]
        target_label: role
      # 전용 ASG 3대가 Name 태그를 공유한다. 이것이 없으면 세 호스트의 메모리와 CPU 가
      # 한 이름으로 겹쳐, 그중 한 대만 마르는 경우를 못 가린다.
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance_id

  # 컨테이너 지표. OOM 감지가 여기서 나온다.
  - job_name: cadvisor
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 8082
        filters:
          - name: instance-state-name
            values: [running]
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance_id

  - job_name: mysqld
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # CloudWatch 지표 자체가 60초 해상도다.
  # 15초로 긁으면 같은 값을 네 번 받으면서 API 요청만 네 배가 되어 무료 한도를 넘는다.
  - job_name: cloudwatch
    scrape_interval: 60s
    static_configs:
      - targets: ["cloudwatch-exporter:9106"]

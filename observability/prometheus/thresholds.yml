# 기준 초과를 가르는 기준 가운데 인프라가 갖는 것이다(lc-infra #107, #111). 06 기준 초과 대시보드와 03 앱과 JVM 이 읽는다.
#
# 이름은 앱이 내보내는 기준(lc-backend 의 lunchcatch.observability.targets)과 같은 overrun_threshold_seconds 다.
# API 목표, 릴레이와 워커의 대기 시간, cron 의 마감은 앱 설정이 kind="api"|"relay"|"worker"|"job" 으로 낸다.
# 작업을 정의한 코드와 그 기준을 같은 저장소에서 함께 고치려는 것이다.
# 여기에는 품질 문서의 [인프라] 항목 값만 둔다. 인프라 담당이 정하고 경보를 받는다.
groups:
  - name: overrun-thresholds
    rules:
      # GC 한 번의 멈춤이다. 품질 문서 성능 효율성 PERF-4-04 의 GC 일시정지 p99 200ms 다
      - record: overrun_threshold_seconds
        expr: vector(0.2)
        labels: {kind: global, name: gc-pause}

      # 커넥션을 얻기까지 기다린 시간이다. 품질 문서 신뢰성 REL-2-03 의 DB 커넥션 획득 3초다(등급 C)
      - record: overrun_threshold_seconds
        expr: vector(3)
        labels: {kind: global, name: connection-acquire}

# 기준 초과를 가르는 기준 가운데 인프라가 갖는 것이다(lc-infra #107, #111). API, 백그라운드 작업, 애플리케이션 서버 자원 대시보드가 읽는다.
#
# 이름은 앱이 내보내는 기준(lc-backend 의 lunchcatch.observability.targets)과 같은 overrun_threshold_seconds 다. 시간이 아닌 비율은 overrun_threshold_ratio 로 둔다.
# API 목표, 릴레이와 워커의 대기 시간, cron 의 마감은 앱 설정이 kind="api"|"relay"|"worker"|"job" 으로 낸다.
# 작업을 정의한 코드와 그 기준을 같은 저장소에서 함께 고치려는 것이다.
# 여기에는 품질 문서의 [인프라] 항목 값과, 인프라 담당이 정해 경보에 쓰는 배치 작업의 임계값만 둔다. 인프라 담당이 정하고 경보를 받는다.
# 커넥션 획득 대기(REL-2-03)는 두지 않는다. 시간 제한(connection-timeout)은 앱 설정이 갖고, 애플리케이션 서버 자원과 경보는 시간 제한에 걸린 횟수로 본다(#111).
groups:
  - name: overrun-thresholds
    rules:
      # GC 한 번의 멈춤이다. 품질 문서 성능 효율성 PERF-4-04 의 GC 일시정지 p99 200ms 다
      - record: overrun_threshold_seconds
        expr: vector(0.2)
        labels: {kind: global, name: gc-pause}
      # 트랜잭션 시간의 상한이다. 품질 문서 데이터 무결성 DI-4-03 의 상한 1초다(#108).
      # 애플리케이션 서버 자원은 커넥션 사용 시간의 p99 와 견주고, 경보 TransactionSlow 는 같은 1초를 버킷 경계로 쓴다
      - record: overrun_threshold_seconds
        expr: vector(1)
        labels: {kind: global, name: transaction}
      # GC 직후의 힙 사용률이다. 품질 문서 성능 효율성의 힙 사용률(GC 직후) 70% 이하다(#108).
      # 시간이 아니라 비율이라 이름을 나눈다. rules.yml 의 경보 HeapAfterGcHigh 도 같은 70% 다. 여기를 고치면 경보도 같이 고친다
      - record: overrun_threshold_ratio
        expr: vector(0.7)
        labels: {kind: global, name: heap-after-gc}
      # GC 로 멈춘 시간의 비율이다. 품질 문서에 값이 없어 rules.yml 의 경보 GcOverheadHigh 의 문턱 10% 를 그대로 둔다(#108).
      # 경보를 고치면 여기도 같이 고친다
      - record: overrun_threshold_ratio
        expr: vector(0.1)
        labels: {kind: global, name: gc-overhead}

  # 배치 작업마다 마지막 성공 뒤 허용하는 시간이다(lc-infra #44, #169). 경보 BatchNotRun 과 백그라운드 작업 대시보드가 함께 읽는다.
  # 작업마다 시계열이 있을 때만 기준이 생긴다. 그 작업이 기동 뒤 한 번도 성공하지 않았으면 기준도 경보도 없다.
  - name: batch-not-run-thresholds
    rules:
      # 주기가 작업마다 달라 임계값을 넷으로 나눈다.
      # 임계값은 다음 실행까지의 간격이 아니라 마지막 성공 뒤 허용하는 시간이다.
      #   30분: 생존 신호(30초), 이어받기(1분), 쿠폰 만료(5분), 후보 예산 갱신(10분). 30분이면 여러 번을 연달아 놓친 것이다
      #   5분: 결제 재조회(1분 간격), 충전 재예약(1분 간격), 노출 릴레이(1초 간격). 멈추면 승인 결과를 모르는 결제가 확정되지 않고, 충전한 광고주의 예약이 다시 잡히지 않고, 유효 노출이 정산에 넘어가지 않아 차감이 멈춘다
      #   50시간: 이벤트 보존(04:00). 하루 놓쳐도 장애가 아니고 다음 날 몰아서 지운다
      #   25시간: 그 밖의 작업. 00:00 묶음, 01:00 집계, 01:30 PG 대사, 02:00 쿠폰 정합과 광고 로그 보존,
      #           03:00 쿠폰 준비와 카카오 연결 해제 재시도, 04:00 템플릿 버전 정리, 10:55 쿠폰 대기열, 11:00 발급 시작, 14:00 발급 마감
      #           하루 한 번 도는 작업을 30분으로 두면 성공한 지 30분 뒤부터 매일 울린다. 2026-10-26 운영에서 9개가 이렇게 울렸다
      # 새 작업은 기본으로 25시간에 들어간다. 분 단위로 도는 작업을 더하면 30분 목록에 이름을 넣는다.
      #
      - record: batch_job_not_run_threshold_seconds
        expr: |
          (max by (scheduler) (batch_job_last_success_timestamp_seconds{scheduler=~".*\\.(sendHeartbeat|takeOverStale|expireCoupons)\\(\\).*|.*CandidateBudgetRefreshJob\\.refresh\\(\\).*"}) * 0 + 1800)
          or
          (max by (scheduler) (batch_job_last_success_timestamp_seconds{scheduler=~".*\\.(recheckUnknownPayments|reserveCharged|dispatchPending)\\(\\).*"}) * 0 + 300)
          or
          (max by (scheduler) (batch_job_last_success_timestamp_seconds{scheduler=~".*\\.purgeExpiredEvents\\(\\).*"}) * 0 + 180000)
          or
          (max by (scheduler) (batch_job_last_success_timestamp_seconds{scheduler!~".*\\.(sendHeartbeat|takeOverStale|expireCoupons|recheckUnknownPayments|reserveCharged|dispatchPending|purgeExpiredEvents)\\(\\).*|.*CandidateBudgetRefreshJob\\.refresh\\(\\).*"}) * 0 + 90000)

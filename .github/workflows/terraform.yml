# 인프라 코드 게이트
#
# 이 저장소에는 빌드가 없어 지금까지 CI 가 보는 것이 문서와 items.yml 의 일치 하나뿐이었다.
# Terraform 이 들어오면서 처음으로 실행 가능한 산출물이 생겼고, 그것을 보는 자리가 여기다.
#
# fmt 와 validate 는 자격증명이 필요 없어 PR 에서 차단해도 된다. 결정론적이라 오탐이 없다.
# plan 은 AWS 를 조회해야 해서 자격증명이 필요하다. 없으면 건너뛴다.
# 상태 파일을 읽는 것뿐이라 plan 자체는 인프라를 바꾸지 않는다.

name: 인프라 코드 검사

#
# 경로 필터를 두지 않고 모든 PR 에서 돈다 (lc-infra #129).
# 이 검사의 게이트가 main 의 필수 검사다. 경로 필터가 있으면 대상 파일을 안 바꾼 PR 은 검사가 영영 오지 않아 병합하지 못한다.
# 대신 아래 changes 가 대상 파일이 바뀌었는지 보고, 안 바뀌었으면 check 를 건너뛰고 게이트가 바로 통과한다.
#
on:
  pull_request:

# plan 이 상태 파일 잠금을 잡으므로 동시에 돌리지 않는다
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write        # OIDC 로 AWS 자격증명을 받는다. 장기 키를 두지 않는다
  pull-requests: write

jobs:
  # 이 PR 이 Terraform 파일을 건드렸는지 본다
  changes:
    runs-on: ubuntu-latest
    outputs:
      tf: ${{ steps.diff.outputs.tf }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 바뀐 파일
        id: diff
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -q -E '\.tf$|\.tftpl$|\.terraform\.lock\.hcl$|^\.github/workflows/terraform\.yml$'; then
            echo "tf=true" >> "$GITHUB_OUTPUT"
          else
            echo "tf=false" >> "$GITHUB_OUTPUT"
          fi

  # 운영과 부하 시험 두 루트가 같은 모듈을 부른다. 모듈을 고치면 둘 다 깨질 수 있어 둘 다 본다
  check:
    needs: changes
    if: needs.changes.outputs.tf == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [envs/prod, envs/lt]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # 확정값은 기술 스택 문서 3.7절에 있다
          terraform_version: "~1.15"

      # 모듈까지 보려고 저장소 루트에서 돈다
      - name: 형식
        working-directory: .
        run: terraform fmt -check -recursive -diff modules envs

      # validate 는 backend 초기화 없이도 돈다. 자격증명이 필요 없다
      - name: 문법
        run: |
          terraform init -backend=false
          terraform validate

      # plan 은 운영만 본다. 부하 시험 환경은 계정마다 상태가 따로라 여기서 볼 상태가 없다
      - name: AWS 자격증명
        if: matrix.root == 'envs/prod'
        id: creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 자격증명이 없으면 여기까지다. fmt 와 validate 만으로도 게이트 값은 한다
      - name: 계획
        if: steps.creds.outcome == 'success'
        run: |
          terraform init -backend-config=backend.hcl
          terraform plan -no-color -lock-timeout=5m

  #
  # main 의 필수 검사가 이 잡이다. 행렬 잡은 건너뛰면 이름이 펼쳐지지 않아 필수 검사로 걸 수 없다.
  # check 가 통과했거나 Terraform 을 안 건드려 건너뛰었으면 통과, 실패하거나 취소됐으면 실패다.
  #
  gate:
    name: 인프라 코드 게이트
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 결과
        run: |
          echo "changes=${{ needs.changes.result }} tf=${{ needs.changes.outputs.tf }} check=${{ needs.check.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          case "${{ needs.check.result }}" in success|skipped) ;; *) exit 1 ;; esac

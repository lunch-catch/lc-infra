items:
  - {id: INF-1-01, doc: code-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "배치 목록을 유형(멱등 전이형, 재계산형, 누적 연산형, 외부 부수효과형, 순번 발급형)으로 분류했는가", criteria: "누적 연산형은 멱등화가 필수이고, 외부 부수효과형은 멱등화로도 못 막아 선점이 필요하다."}
  - {id: INF-1-04, doc: code-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "상태 전이가 조건부 UPDATE인가", criteria: "조회 후 갱신 패턴이 남아 있으면 갱신 손실이 그대로 발생한다."}
  - {id: INF-1-05, doc: code-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "누적 연산이 전이 성공에 종속되는가", criteria: "`affected rows`가 0이면 즉시 종료해야 한다. 전이는 실패했는데 수량만 늘어나는 것을 막는다."}
  - {id: INF-1-06, doc: code-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "외부 호출 전에 상태를 선점하는가", criteria: "호출 후 상태를 바꾸면 그 사이에 다른 인스턴스가 같은 행을 집어 들어 중복 발송이 된다."}
  - {id: INF-1-09, doc: code-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "시각 기준을 애플리케이션 `Clock`으로 통일했는가", criteria: "`NOW()`와 `Instant.now()`를 섞으면 DB 시각과 인스턴스 시각 두 기준이 공존한다."}
  - {id: INF-1-10, doc: code-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "스케줄러 설정이 `batch` 프로필로 감싸여 있는가", criteria: "앱 인스턴스에서 스케줄러가 켜지면 앱 대수만큼 배치가 중복 실행된다. 락이 없으므로 아무것도 막지 못한다."}
  - {id: INF-1-11, doc: code-guideline.md, ch: 1, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "배치 시작 로그에 `job_name`, `scheduled_at`, `instance_id`를 남기는가", criteria: "중복 실행을 탐지하는 유일한 근거다. 이 로그가 없으면 중복이 났는지 알 수 없다."}
  - {id: INF-2-01, doc: code-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "종료 신호를 받으면 새 배치를 시작하지 않는가", criteria: "수명주기 훅이 `Terminating:Wait`로 잡아 두는 동안 드레이닝 플래그를 세운다."}
  - {id: INF-2-02, doc: code-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "진행 중인 배치가 끝날 때까지 기다린 뒤 훅에 완료 신호를 보내는가"}
  - {id: INF-2-03, doc: code-guideline.md, ch: 2, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "훅이 실패해도 조건부 UPDATE 방어가 남아 있는가", criteria: "훅은 최적화이고 정합성 보장은 조건부 UPDATE가 한다."}
  - {id: INF-3-01, doc: code-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "JVM 옵션에 `networkaddress.cache.ttl`이 설정되어 있는가", criteria: "이 설정이 빠지면 다른 모든 설정을 맞춰도 페일오버 후 복구가 되지 않는다."}
  - {id: INF-3-02, doc: code-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "JDBC URL에 `connectTimeout`과 `socketTimeout`이 있는가"}
  - {id: INF-3-03, doc: code-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "Hikari `connection-timeout`이 설정되어 있는가"}
  - {id: INF-3-04, doc: code-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "쓰기 경로에 `@Transactional(timeout)`이 지정되어 있는가"}
  - {id: INF-3-05, doc: code-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "`socketTimeout`이 가장 오래 걸리는 정상 쿼리보다 긴가", criteria: "짧으면 장애가 아닌 상황에서도 정상 쿼리가 잘린다."}
  - {id: INF-3-06, doc: code-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "`maximum-pool-size`와 `minimum-idle`이 같은 값인가", criteria: "풀 크기를 고정해 부하 급증 시 커넥션 생성 지연을 없앤다."}
  - {id: INF-3-07, doc: code-guideline.md, ch: 3, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "`max-lifetime`이 DB `wait_timeout`보다 짧은가"}
  - {id: INF-4-01, doc: code-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "readiness 그룹에 공유 의존성(DB, 캐시, 외부 API)을 넣지 않았는가", criteria: "넣으면 그 의존성 장애 시 모든 인스턴스가 동시에 대상 그룹에서 빠져 상황이 악화된다. Spring Boot 기본 동작이 이미 올바르므로 **그룹을 재정의하지 않는 것**이 정답이다."}
  - {id: INF-4-02, doc: code-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "liveness가 프로세스 생존만 보는가"}
  - {id: INF-4-03, doc: code-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "`management.endpoint.health.probes.enabled`가 켜져 있는가"}
  - {id: INF-4-04, doc: code-guideline.md, ch: 4, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "`show-details`가 `never`인가"}
  - {id: INF-5-01, doc: code-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "`restart` 정책이 `always`가 아니라 `unless-stopped`인가", criteria: "`always`면 배포 중 의도적으로 내린 컨테이너를 Docker가 다시 살려 배포 절차와 충돌한다."}
  - {id: INF-5-02, doc: code-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "`JAVA_TOOL_OPTIONS`에 `MaxRAMPercentage`가 지정되어 있는가", criteria: "없으면 힙이 컨테이너 한계를 넘어 커널이 프로세스를 죽인다. 힙 덤프가 남지 않아 원인 분석이 불가능하다."}
  - {id: INF-5-03, doc: code-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "healthcheck `start_period`가 기동 시간을 감당하는가", criteria: "짧으면 기동 도중 계속 재기동되는 무한 루프에 빠진다."}
  - {id: INF-5-04, doc: code-guideline.md, ch: 5, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "종료 타임아웃 4계층이 안에서 바깥으로 갈수록 긴가", criteria: "ALB deregistration 30초 <= Spring graceful 30초 <= Docker stop_grace 45초 <= systemd 60초."}
  - {id: INF-6-01, doc: code-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "스키마 변경이 확장 후 축소(추가만)인가", criteria: "컬럼 삭제, 이름 변경, 기본값 없는 `NOT NULL` 추가, 타입 축소는 구 버전을 깨뜨려 롤백이 불가능해진다."}
  - {id: INF-6-02, doc: code-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "API 응답 필드를 제거하거나 이름을 바꾸지 않았는가", criteria: "혼재 구간에는 클라이언트가 요청마다 다른 버전에 도달한다."}
  - {id: INF-6-03, doc: code-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "배치 상태 전이가 두 버전 모두에서 안전한가", criteria: "어느 버전이 락을 잡을지 알 수 없으므로 조건부 UPDATE가 유일한 방어선이다."}
  - {id: INF-6-04, doc: code-guideline.md, ch: 6, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "CI에 파괴적 DDL 차단이 걸려 있는가"}
  - {id: INF-7-01, doc: code-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "현재 배포 버전을 SSM 파라미터로 읽는가", criteria: "user-data가 `/{project}/current-sha`를 조회해 컨테이너를 띄운다."}
  - {id: INF-7-02, doc: code-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "DB 엔드포인트를 SSM 파라미터로 읽는가", criteria: "RDS 복원은 항상 새 인스턴스를 만들어 엔드포인트가 바뀐다."}
  - {id: INF-7-03, doc: code-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "배포 스크립트가 컨테이너 교체보다 **먼저** SSM 값을 갱신하는가", criteria: "나중에 갱신하면 그 사이 교체된 인스턴스가 구버전으로 올라온다."}
  - {id: INF-7-04, doc: code-guideline.md, ch: 7, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "롤백 시 SSM 값도 함께 되돌리는가"}
  - {id: INF-8-01, doc: code-guideline.md, ch: 8, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "누적 값 테이블에 변경 이력이 함께 남는가", criteria: "이력이 없으면 부분 복구가 불가능하고 정합성 검증 자체가 성립하지 않는다."}
  - {id: INF-8-02, doc: code-guideline.md, ch: 8, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "정합성 검증 배치가 이력에서 재계산한 값과 현재 값을 대조하는가"}
  - {id: INF-8-03, doc: code-guideline.md, ch: 8, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "알람 메시지에 오차 건수, 최대 오차, 최근 변경 시각, 변경 주체가 포함되는가", criteria: "변경 주체가 전부 같은 시각의 `BATCH`라면 원인이 즉시 드러난다."}
  - {id: INF-9-01, doc: code-guideline.md, ch: 9, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "액추에이터가 `management.server.port` 로 8080 과 분리되어 있고 `/actuator/prometheus` 가 노출되는가", criteria: "같은 포트에 두면 밖에서 막을 규칙이 따로 필요하고, 그 규칙이 지워지면 그대로 열린다. 포트를 나누면 8080 에 그 경로가 존재하지 않는다."}
  - {id: INF-9-02, doc: code-guideline.md, ch: 9, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "메트릭 태그에 `application`과 `instance`가 있는가"}
  - {id: INF-9-03, doc: code-guideline.md, ch: 9, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "로그가 stdout JSON이고 `traceId`가 MDC에 실리는가", criteria: "롤링 혼재 구간에서 구 버전과 신 버전의 로그를 구분해 따라가려면 이 값이 필요하다."}
  - {id: INF-9-04, doc: code-guideline.md, ch: 9, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "Loki 레이블에 식별자처럼 값 종류가 무한한 항목을 넣지 않았는가", criteria: "카디널리티가 폭발해 Loki가 느려진다. 본문 JSON 필드로 두고 쿼리 시 파싱한다."}
  - {id: INF-9-05, doc: code-guideline.md, ch: 9, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "추적 샘플링 비율이 환경 변수로 주입되는가", criteria: "장애 주입 실험 직전에 100%로 올릴 수 있어야 한다."}
  - {id: INF-11-01, doc: code-guideline.md, ch: 11, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "응답에 넣는 이미지 URL 이 CloudFront 도메인인가", criteria: "S3 직접 URL(`*.s3.*.amazonaws.com`)을 노출하면 버킷을 비공개로 둔 의미가 없다. 접근은 거부되지만 버킷 이름과 키 구조가 드러난다. **presigned PUT URL 은 예외다.** 업로드는 오리진에 직접 서명하는 것이라 구조상 S3 호스트일 수밖에 없다. 이 항목은 조회용 URL 이 대상이다."}
  - {id: INF-11-02, doc: code-guideline.md, ch: 11, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "presigned URL 발급 전에 요청자의 권한을 확인하는가", criteria: "서명은 그 자체로 접근 권한이다. 발급 조건을 확인하지 않으면 누구나 남의 경로에 쓸 수 있다."}
  - {id: INF-11-03, doc: code-guideline.md, ch: 11, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "업로드 키(저장 경로)를 서버가 정하는가", criteria: "클라이언트가 준 파일명을 그대로 쓰면 경로 조작과 덮어쓰기가 가능하다."}
  - {id: INF-11-04, doc: code-guideline.md, ch: 11, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "업로드 완료 통지에서 키를 클라이언트에게 받지 않는가", criteria: "서명은 **올리는 것**만 막지 **저장하는 것**은 막지 못한다. 키를 돌려받아 저장하면 남의 키를 실어 보내 남의 이미지를 자기 리소스에 붙일 수 있다. 발급 시점에 서버가 키를 저장해 두고 통지는 발급 식별자로만 받는다."}
  - {id: INF-11-05, doc: code-guideline.md, ch: 11, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "이미지 URL 을 통째로 저장하지 않고 키만 저장하는가", criteria: "도메인은 환경마다 다르므로 설정에서 붙인다. 전체 URL 을 저장하면 도메인이 바뀔 때 전 행을 고쳐야 하고, 나중에 CloudFront 서명 URL 로 바꿀 수도 없다. 서명은 발급할 때마다 달라지는데 저장된 값은 고정이기 때문이다."}
  - {id: INF-11-06, doc: code-guideline.md, ch: 11, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "발급 때 크기 상한을 검사하고 `Content-Type` 과 크기를 서명 조건에 넣는가", criteria: "서명만 발급하고 조건을 안 걸면 클라이언트가 무엇이든 올릴 수 있다. 업로드가 앱을 거치지 않으므로 사전 방어는 이것뿐이다. presigned PUT 은 범위 조건을 걸 수 없어(`content-length-range` 는 POST policy 의 기능이다) 신고받은 정확값을 서명한다. 그래서 상한 검사는 발급 요청을 받은 자리에서 따로 해야 한다. 크게 신고하면 여기서 걸리고, 작게 신고하고 큰 파일을 올리면 S3 가 거부한다. 상한 값은 용도마다 다르며 `백엔드공통_이미지저장소_설계.md` 6.2절에 있다."}
  - {id: INF-11-07, doc: code-guideline.md, ch: 11, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "S3 접근에 액세스 키가 아니라 IAM 역할을 쓰는가", criteria: "앱이 EC2에서 돌고 시크릿은 SSM을 쓰므로 액세스 키를 코드나 설정에 둘 이유가 없다."}
  - {id: INF-11-08, doc: code-guideline.md, ch: 11, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "이미지 삭제가 S3 객체 삭제까지 이어지고, 객체를 먼저 지우는가", criteria: "DB 레코드만 지우면 객체가 남아 저장 비용이 계속 나가고, 키를 아는 사람은 계속 볼 수 있다. 순서도 본다. 행을 먼저 지우면 키를 잃어 그 객체를 다시 찾을 방법이 없어지고 고아가 확정된다. 객체를 먼저 지우면 행 삭제가 실패해도 사용자가 다시 지워 해소된다. `DeleteObject` 는 없는 객체에도 성공하므로 재시도가 안전하다. 되돌릴 수 없는 쪽을 피하는 것이며, `INF-11-13` 의 정리 배치와 같은 규칙이다."}
  - {id: INF-11-09, doc: code-guideline.md, ch: 11, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "이미지 조회 쿼리가 확정된 행만 고르는가", criteria: "`INF-11-04` 때문에 발급 시점에 행이 먼저 생기므로, 아직 올라오지 않은 행이 테이블에 남아 있다. 조건을 빠뜨리면 업로드를 중간에 그만둔 이미지가 그대로 응답에 실려 깨진 이미지가 나간다. 응답을 만든 뒤 걸러내지 말고 쿼리에서 걸러야 한다. 목록 조회가 특히 그렇다."}
  - {id: INF-11-10, doc: code-guideline.md, ch: 11, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "업로드 완료 통지에서 객체 존재와 서명 조건 일치를 S3 에 확인하는가", criteria: "업로드가 앱을 거치지 않으므로 서버는 `PUT` 이 실제로 일어났는지 모른다. 통지는 클라이언트의 주장일 뿐이다. 통지만 믿고 확정하면 객체가 없는 키가 조회 응답에 실려 `INF-11-09` 를 지켜도 깨진 이미지가 나간다. `HeadObject` 로 존재를 확인하고, `Content-Length` 와 `Content-Type` 이 서명 조건과 같은지 대조한다. `INF-11-06` 의 조건은 올리는 것만 막으므로, 올라온 것이 조건과 같은지는 이 시점에서만 확인된다."}
  - {id: INF-11-11, doc: code-guideline.md, ch: 11, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "업로드 확정 요청에서 발급 건이 요청자와 대상 리소스에 속하는지 확인하는가", criteria: "`uploadId` 도 클라이언트가 보낸 식별자다. 그것으로 행을 찾은 것은 발급 건이 존재한다는 뜻일 뿐 요청자 것이라는 뜻이 아니다. 경로의 리소스 식별자와 행의 FK 가 같은지, 그 리소스가 인증 주체의 것인지 둘 다 본다. 확인하지 않으면 남의 발급 건 번호를 실어 보내 남의 이미지를 자기 리소스에 붙일 수 있어, `INF-11-04` 가 키를 안 받은 것이 무의미해진다. `INF-11-02` 는 발급 시점만 다룬다. 확정은 별개의 요청이고 그 사이에 권한이 바뀌었을 수도 있다. 어긋날 때 `403` 이 아니라 `404` 를 주어야 번호를 훑어 남의 발급 건의 존재를 알아내지 못한다."}
  - {id: INF-11-12, doc: code-guideline.md, ch: 11, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "조회 시점 확정을 두었다면 유효 창과 단건 조회로 한정했는가", criteria: "확정 통지가 유실된 업로드를 조회할 때 `HeadObject` 로 되살리는 경우에만 해당한다. 두지 않았다면 이 항목은 대상 밖이다. 발급한 지 오래된 행까지 시도하면 조회가 끝나지 않는 재시도가 된다. 확정될 수 없는 행은 계속 미확정이라 볼 때마다 다시 묻게 되고, 결과는 매번 같다. 목록 조회에 넣으면 리소스 수 × 이미지 수만큼 동기 외부 호출이 되어 응답 시간이 S3 지연에 묶인다. 목록은 확정된 행만 걸러 내보낸다. 확정 `UPDATE` 는 조회 트랜잭션 밖에서 조건부로 쓴다. 같은 리소스를 동시에 조회한 요청들이 같은 행을 확정하려 든다. 서명 조건 대조에 실패하면 확정만 하지 않는다. 객체를 지우는 것은 배치 몫이며, 조회가 S3 객체를 삭제하는 구조는 만들지 않는다."}
  - {id: INF-11-13, doc: code-guideline.md, ch: 11, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "미확정 업로드를 정리하는 배치가 있고 S3 객체를 먼저 지우는가", criteria: "확정 통지가 유실되면 아무도 참조하지 않는 객체가 남는다. 조회에서 빠지므로 사용자 눈에 안 보이고, 그래서 어떤 삭제 경로에도 걸리지 않는다. `INF-11-08`은 사용자가 이미지를 지우는 경우만 다룬다. 확정된 적 없는 객체는 지울 대상으로 보이지도 않는다. 행을 먼저 지우면 키를 잃어 객체를 영영 못 찾는다. S3 삭제가 먼저다. 유예 시간이 `INF-11-12`의 유효 창보다 짧으면 아직 되살릴 수 있는 업로드를 배치가 지운다. 같은 값을 반대 방향으로 써야 한다. 대상 조회가 상태와 생성 시각 복합 인덱스를 타는지 본다. 없으면 매 주기 풀스캔이다. `INF-1-01`의 외부 부수효과형이므로 1장의 락 항목이 모두 적용된다."}
  - {id: INF-12-01, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "`required_version` 과 AWS 프로바이더 버전이 고정되어 있는가", criteria: "코어는 `~> 1.15`, 프로바이더는 `~> 6.0` 이다. 프로바이더 고정이 코어보다 실질적으로 더 중요하다. 리소스 스키마가 거기서 바뀐다."}
  - {id: INF-12-02, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "상태 백엔드가 S3 이고 `encrypt` 와 `use_lockfile` 이 켜져 있는가", criteria: "DynamoDB 잠금 테이블이 아니라 S3 네이티브 잠금을 쓴다. `backend 's3'` 블록 안에서는 변수 보간이 안 되므로 값은 `-backend-config` 로 넘긴다."}
  - {id: INF-12-03, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "SSM `current-sha` 파라미터에 `ignore_changes = [value]` 가 걸려 있는가", criteria: "값은 배포 스크립트가 갱신한다. 이 줄이 없으면 다음 `apply` 가 값을 `bootstrap` 으로 되돌려 전 인스턴스가 구버전으로 기동한다."}
  - {id: INF-12-04, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "앱 ASG 에 `ignore_changes = [desired_capacity]` 가 걸려 있는가", criteria: "배포 중 desired 가 일시적으로 2가 된다. 이 줄이 없으면 `apply` 가 배포를 되돌린다."}
  - {id: INF-12-05, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "앱 ASG 가 `min_size` 0, `desired_capacity` 1, `max_size` 2, `health_check_type` `ELB` 인가", criteria: "`max_size` 가 2여야 배포 절차가 성립한다. desired 를 2로 두면 신규를 띄울 자리가 없다."}
  - {id: INF-12-06, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "ALB 에 `enable_deletion_protection` 과 `prevent_destroy` 가 둘 다 있는가", criteria: "IaC 도입으로 오히려 커진 위험이다. 잘못된 변수 파일로 destroy 를 돌리면 ALB 가 사라지고 DNS 이름이 바뀐다. 두 겹으로 막는다."}
  - {id: INF-12-07, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "앱 시작 템플릿의 user-data 에 `batch` 프로필이 없는가", criteria: "배치 프로세스가 하나라는 전제가 이 문자열 하나에 걸려 있다. 앱 ASG 에 들어가면 앱 대수만큼 배치가 돈다. 분산 락이 없으므로 아무것도 막지 못한다."}
  - {id: INF-12-08, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "앱 시작 템플릿이 이미지 태그를 고정하지 않고 SSM 에서 읽는가", criteria: "고정하면 ASG 교체 시 최초 구축 시점 버전이 올라온다. 장애 복구가 곧 버전 롤백이 되고 혼재 구간이 무기한 지속된다."}
  - {id: INF-12-09, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "모니터링 인스턴스가 ASG 밖에 있는가", criteria: "ASG 의 desired 0 은 EBS 까지 삭제한다. Prometheus 와 Loki 데이터가 사라진다."}
  - {id: INF-12-10, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "NAT Gateway 리소스가 없는가", criteria: "월 40 USD 이상으로 예산의 4분의 1을 차지한다. 앱을 퍼블릭 서브넷에 두는 설계 전체가 이 결정에서 나왔다."}
  - {id: INF-12-11, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "22번 포트를 여는 인바운드 규칙이 없는가", criteria: "운영 접근은 SSM Session Manager 로 한다."}
  - {id: INF-12-12, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "보안 그룹 인바운드가 CIDR 이 아니라 보안 그룹 참조인가", criteria: "앱이 퍼블릭 서브넷에 있으므로 보안은 서브넷이 아니라 보안 그룹이 확보한다. CIDR 로 열면 그 전제가 깨진다. 인터넷을 받는 ALB 만 예외다."}
  - {id: INF-12-13, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "모든 CloudWatch 로그 그룹에 `retention_in_days` 가 있는가", criteria: "기본값이 무기한이라 생략하면 저장이 계속 누적된다."}
  - {id: INF-12-14, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "CloudWatch 알람이 6개 이하이고 전부 단일 지표인가", criteria: "무료 한도가 10개다. 이상 탐지, 복합 알람, 고해상도 알람, 커스텀 지표 전송, CloudWatch 대시보드는 쓰지 않는다. 각각 별도 과금이다."}
  - {id: INF-12-15, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "RDS 에 `multi_az`, `backup_retention_period` 7, `deletion_protection`, `skip_final_snapshot = false` 가 있는가", criteria: "자동 백업은 인스턴스를 지우면 함께 사라진다. 최종 스냅샷을 건너뛰면 되돌릴 수단이 없다."}
  - {id: INF-12-16, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "RDS 파라미터 그룹에 `max_connections` 를 지정하지 않았는가", criteria: "기본 파라미터 그룹의 공식을 그대로 쓴다. 1 GiB 에서 커넥션당 12MB 라 공식보다 높게 잡으면 OOM 이 난다."}
  - {id: INF-12-17, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "캐시가 `aws_elasticache_cluster` 가 아니라 `aws_elasticache_replication_group` 인가", criteria: "복제본 추가는 replication group 에만 가능하다. 나중에 바꾸려면 이관이 필요하고 지금 정하면 비용 차이가 0 이다."}
  - {id: INF-12-18, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "ACM 검증용 DNS 레코드가 Terraform 관리 대상인가", criteria: "자동 갱신은 검증 레코드가 살아 있을 때만 된다. 레코드가 사라지면 갱신이 조용히 실패하고 만료 시점에야 드러난다."}
  - {id: INF-12-19, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "대상 그룹이 트래픽 포트 8080 과 헬스체크 포트 8081 을 나눠 보는가", criteria: "액추에이터를 관리 포트로 뺐으므로 헬스체크도 그쪽을 봐야 한다. 8080 에는 그 경로가 없어 인증 실패로 떨어진다."}
  - {id: INF-12-21, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "8081 을 여는 인바운드가 ALB 와 모니터링 보안 그룹뿐인가", criteria: "이 포트가 밖으로 열리면 관리 포트로 분리한 의미가 사라진다."}
  - {id: INF-12-22, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "80 에서 443 으로의 리다이렉트가 있는가", criteria: "stateless JWT 가 헤더로 오가므로 평문 구간을 둘 수 없다 (INF-17)."}
  - {id: INF-12-20, doc: code-guideline.md, ch: 12, level: 코드, gate: G-PR, gates: [local, ci], ci_stage: 2, domains: [application, infra], level_verified: false, title: "오토스케일링 정책을 만들었다면 지표가 `ALBRequestCountPerTarget` 인가", criteria: "버스트 인스턴스에서 CPU 사용률은 왜곡된다. 크레딧 소진을 구조적으로 감지하지 못한다. 현재 구성에서는 상한이 2대라 정책 자체를 두지 않는 것이 기본이다."}
  - {id: OPS-1-01, doc: operation-guideline.md, ch: 1, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "부하 시험에서 앱이 병목으로 확인되었는가", criteria: "DB가 병목이면 앱을 늘려도 효과가 없다."}
  - {id: OPS-1-02, doc: operation-guideline.md, ch: 1, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "`max_connections`가 목표 인스턴스 수를 수용하는가"}
  - {id: OPS-1-03, doc: operation-guideline.md, ch: 1, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "조건부 UPDATE가 구현되고 검증되었는가"}
  - {id: OPS-1-04, doc: operation-guideline.md, ch: 1, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "수명주기 훅이 구현되었는가"}
  - {id: OPS-1-05, doc: operation-guideline.md, ch: 1, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "인스턴스 기동 시간이 대응 가능한 수준인가", criteria: "5분이면 급격한 트래픽 증가에는 사실상 무력하다."}
  - {id: OPS-1-06, doc: operation-guideline.md, ch: 1, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "최대 인스턴스 수 상한이 예산 안에 있는가", criteria: "오토스케일링은 비용 상한을 없앤다."}
  - {id: OPS-1-07, doc: operation-guideline.md, ch: 1, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "RDS `max_connections`가 배포 중 45를 수용하는가", criteria: "앱 2대 20에 배치 인스턴스 10과 관리 커넥션을 더한 값이다. 앱만 세면 30으로 보여 여유를 과대평가한다."}
  - {id: OPS-1-09, doc: operation-guideline.md, ch: 1, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "조건부 UPDATE가 모든 누적 연산에 적용되었는가"}
  - {id: OPS-1-10, doc: operation-guideline.md, ch: 1, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "배포 절차에 인스턴스 수를 하드코딩한 곳이 없는가"}
  - {id: OPS-1-11, doc: operation-guideline.md, ch: 1, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "RDS `max_connections`를 실측했는가", criteria: "이중화와 오토스케일링 상한의 전제다."}
  - {id: OPS-1-12, doc: operation-guideline.md, ch: 1, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "PITR 복원 RTO와 RPO를 리허설로 실측했는가", criteria: "현재 문서의 60분과 5분은 근거 없는 목표치다."}
  - {id: OPS-1-13, doc: operation-guideline.md, ch: 1, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "서울 리전 ALB와 RDS 실제 단가를 요금 계산기로 검증했는가", criteria: "총액의 약 3분의 1이 추정치다."}
  - {id: OPS-1-14, doc: operation-guideline.md, ch: 1, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "인스턴스 기동 실측 시간을 기록했는가", criteria: "워밍업과 쿨다운 계산의 출발점이다."}
  - {id: OPS-2-01, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "`docker kill`로 컨테이너 급사를 주입하고 자동 재기동과 오류 구간을 측정했는가"}
  - {id: OPS-2-02, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "`docker pause` 60초로 응답 정지를 주입했는가", criteria: "급사보다 정지가 위험하다. 프로세스는 살아 있어 TCP 연결은 수립되지만 응답이 없다."}
  - {id: OPS-2-03, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "RDS `reboot with failover`로 페일오버를 주입하고 정상화 시간을 측정했는가", criteria: "60초를 크게 초과하면 JVM DNS 캐시 설정을 확인한다."}
  - {id: OPS-2-04, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "페일오버 중 톰캣 스레드가 고갈되지 않고 헬스 엔드포인트가 계속 응답했는가"}
  - {id: OPS-2-05, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "**앱 재기동 없이 자동 복구되었는가**", criteria: "재기동해야만 복구된다면 DNS 캐시 설정이 적용되지 않은 것이다. 검증에서 가장 중요한 항목이다."}
  - {id: OPS-2-06, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "정상 배포에서 혼재 구간과 구 인스턴스 종료 시 오류율이 0인가"}
  - {id: OPS-2-07, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "기동에 실패하는 이미지를 배포했을 때 신규만 종료되고 구 인스턴스가 서비스를 유지하는가"}
  - {id: OPS-2-08, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "**배포 직후 인스턴스를 종료했을 때 교체된 인스턴스가 신 버전으로 올라오는가**", criteria: "SSM 장치가 동작하는지 확인하는 롤링 고유의 검증이다. 없으면 장애 복구가 버전 롤백을 일으키는 사고를 배포 몇 번 뒤에야 발견한다."}
  - {id: OPS-2-09, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "이미지 pull 실패 시 스모크 테스트가 SHA 불일치를 잡아내는가"}
  - {id: OPS-2-10, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "롤백 시 SSM 값이 함께 되돌려지는가"}
  - {id: OPS-2-11, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "**매 배포 후 롤백을 한 번씩 연습했는가**", criteria: "평소에 실행되지 않는 코드는 정작 필요한 순간에 처음 돌아간다."}
  - {id: OPS-2-12, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "Slack 연동 두 경로(Chatbot, Alertmanager)가 각각 도달하는가"}
  - {id: OPS-2-13, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "억제 규칙이 상위 알람 발동 시 하위 알람을 묻는가"}
  - {id: OPS-2-14, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "해소 통지가 Critical에만 오고 Warning에는 오지 않는가"}
  - {id: OPS-2-15, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "Watchdog이 5분 주기로 도착하고 Alertmanager 중지 시 끊기는가"}
  - {id: OPS-2-16, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "**정합성 검증 실패 알람을 테스트 데이터로 발동시켜 확인했는가**", criteria: "이 알람은 실제 사고 전까지 한 번도 발동하지 않으므로 동작 확인 기회가 없다."}
  - {id: OPS-2-17, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "알람 메시지에 오차 건수, 최대 오차, 최근 변경 시각과 주체가 포함되는가"}
  - {id: OPS-2-18, doc: operation-guideline.md, ch: 2, level: 운영, gate: G-AUDIT, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "설정을 Git으로 변경 후 reload로 반영되고 인스턴스 재생성 후에도 유지되는가"}
  - {id: PRE-1-01, doc: preflight-guideline.md, ch: 1, level: 실행전, gate: G-RELEASE, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "RDS가 `available`인가", criteria: "중지되었거나 유지보수 중이면 교체된 인스턴스가 기동에 실패한다."}
  - {id: PRE-1-02, doc: preflight-guideline.md, ch: 1, level: 실행전, gate: G-RELEASE, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "ElastiCache가 `available`인가", criteria: "캐시 없이 배포하면 강등 경로가 섞여 판정이 흐려진다."}
  - {id: PRE-1-03, doc: preflight-guideline.md, ch: 1, level: 실행전, gate: G-RELEASE, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "모니터링 인스턴스가 `running`이고 Prometheus가 응답하는가", criteria: "관측 없이 배포하면 배포 영향을 판정할 수 없다."}
  - {id: PRE-1-04, doc: preflight-guideline.md, ch: 1, level: 실행전, gate: G-RELEASE, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "대상 그룹의 healthy 수가 desired와 일치하는가", criteria: "**가장 중요한 항목이다.** 이미 용량이 절반인 상태에서 롤링을 시작하면 서비스가 통째로 끊긴다."}
  - {id: PRE-1-05, doc: preflight-guideline.md, ch: 1, level: 실행전, gate: G-RELEASE, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "ACM 인증서 잔여일이 30일을 넘는가", criteria: "배포 중 만료되면 전면 접속 불가가 된다."}
  - {id: PRE-1-06, doc: preflight-guideline.md, ch: 1, level: 실행전, gate: G-RELEASE, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "Route 53 헬스체크가 정상인가", criteria: "외부에서 이미 접속 불가한 상태일 수 있다."}
  - {id: PRE-2-01, doc: preflight-guideline.md, ch: 2, level: 실행전, gate: G-RELEASE, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "1절의 배포 사전 점검 항목을 모두 통과하는가"}
  - {id: PRE-2-02, doc: preflight-guideline.md, ch: 2, level: 실행전, gate: G-RELEASE, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "CPU 크레딧이 예정 시험 시간을 감당하는가", criteria: "부족한 상태로 부하를 걸면 측정값이 서버 성능이 아니라 **크레딧 소진 시점**이 된다."}
  - {id: PRE-2-03, doc: preflight-guideline.md, ch: 2, level: 실행전, gate: G-RELEASE, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "Watchdog 신호가 최근 5분 내에 있는가", criteria: "알림 파이프라인이 끊긴 상태에서 시험하면 장애를 놓친다."}
  - {id: PRE-2-04, doc: preflight-guideline.md, ch: 2, level: 실행전, gate: G-RELEASE, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "직전 시험과 10분 이상 간격이 있는가", criteria: "CloudWatch 기본 모니터링이 5분 간격이라, 직후에는 마지막 데이터 포인트가 시험 전 값이어서 **실제보다 높은 잔량이 보인다.**"}
  - {id: PRE-2-05, doc: preflight-guideline.md, ch: 2, level: 실행전, gate: G-RELEASE, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "배포가 진행 중이지 않은가", criteria: "인스턴스 수가 달라 조건이 바뀐다."}
  - {id: PRE-2-06, doc: preflight-guideline.md, ch: 2, level: 실행전, gate: G-RELEASE, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "인스턴스 타입을 상수로 박지 않고 현재 구성을 조회해 계산하는가", criteria: "t3.small을 t3.medium으로 승급하면 vCPU와 적립량이 달라지는데, 상수로 두면 계산이 조용히 틀린다."}
  - {id: PRE-2-07, doc: preflight-guideline.md, ch: 2, level: 실행전, gate: G-RELEASE, gates: [local, ci], ci_stage: 2, domains: [infra], level_verified: false, title: "계산에 RDS를 포함하는가", criteria: "RDS는 EC2보다 적립량이 절반이라 두 배 빨리 소진된다. 부하 시험 중에는 RDS 쪽을 먼저 본다."}
